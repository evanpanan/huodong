  toast('CSV 已导出，Excel / WPS 可直接打开');
}
function exportJSON(){
  // 当前表也要进备份，否则没点过「保存存档」就导出会得到空文件
  var list = archive.map(function(a){ return a; });
  var cur = {id: curId || ('cur-' + Date.now()), title: doc.title || '当前表', updated: Date.now(), doc: clone(doc)};
  var idx = -1;
  if(curId) list.forEach(function(a, i){ if(a.id === curId) idx = i; });
  if(idx >= 0) list[idx] = cur; else list.push(cur);
  lastBackup = Date.now();
  persist();
  dl(tsName('json'), JSON.stringify({app:'itinerary-table', version:2, exported:new Date().toISOString(), archive:list}, null, 2), 'application/json');
  toast('已导出 ' + list.length + ' 份（含当前表）');
}
function importJSON(file){
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var s = JSON.parse(fr.result);
      if(Array.isArray(s.archive) && s.archive.length){
        s.archive.forEach(function(a){ if(!archive.some(function(x){ return x.id === a.id; })) archive.push(a); });
        var last = s.archive[s.archive.length-1];
        doc = normalizeDoc(clone(last.doc)); curId = last.id;
        toast('导入成功：' + s.archive.length + ' 份存档');
      }else if(s.rows){
        doc = normalizeDoc(s); doc.id = doc.id || uid(); curId = doc.id;
        archive.push({id:curId, title:doc.title || '导入的表', updated:Date.now(), doc:clone(doc)});
        toast('导入成功：1 张表');
      }else throw 0;
      paint(); renderAll(); persist();
    }catch(e){ askAlert('导入失败', '文件格式不正确，请选择本工具导出的 JSON 备份文件。'); }
  };
  fr.readAsText(file);
}

/* ================= 高清图导出（Canvas 自绘，零依赖） ================= */
var MCTX = document.createElement('canvas').getContext('2d');
var FONT_STACK = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif';
var NAVY = '#152747', GOLD = '#c39a3e', INK = '#16202e', SUBINK = '#46536a', MUTE = '#7b8798', LINE = '#ccd6e3';

function setF(ctx, size, weight){ ctx.font = (weight || 400) + ' ' + size + 'px ' + FONT_STACK; }
function wrapLines(ctx, text, maxW){
  var out = [];
  String(text == null ? '' : text).split(/\r?\n/).forEach(function(par){
    if(par === ''){ out.push(''); return; }
    var line = '';
    for(var i = 0; i < par.length; i++){
      var ch = par.charAt(i);
      if(ctx.measureText(line + ch).width > maxW && line.length){
        var sp = line.lastIndexOf(' ');
        if(sp > 0 && /[A-Za-z0-9]/.test(ch)){
          out.push(line.slice(0, sp));
          line = line.slice(sp + 1) + ch;
        }else{ out.push(line); line = ch; }
      }else{ line += ch; }
    }
    out.push(line);
  });
  return out;
}
function tint(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function rrect(ctx, x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawLines(ctx, lines, x, y, lh, color, align, width){
  ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  var ax = align === 'center' ? x + width/2 : (align === 'right' ? x + width : x);
  for(var i = 0; i < lines.length; i++) ctx.fillText(lines[i], ax, y + i*lh);
}

/* ---------- 横版（电脑 / 投屏 / 打印） ---------- */
var LCOLS = [
  {k:'seq',  t:'序号',        w:0.48, al:'center'},
  {k:'date', t:'日期',        w:1.12, al:'center'},
  {k:'phase',t:'环节',        w:1.34, al:'left'},
  {k:'time', t:'时间',        w:1.22, al:'center'},
  {k:'place',t:'地点',        w:1.42, al:'left'},
  {k:'disp', t:'调度负责人',  w:1.16, al:'center'},
  {k:'duty', t:'工作职责',    w:3.00, al:'left'},
  {k:'staff',t:'拆阳工作人员',w:1.70, al:'left'},
  {k:'note', t:'注意事项',    w:3.20, al:'left'},
  {k:'mid',  t:'中阳负责伙伴',w:1.18, al:'left'}
];
function buildLandscape(model, forceW){
  var W = forceW || 2400, M = Math.round(Math.min(90, Math.max(54, W * 0.028))), FS = 27, LH = 37, CPAD = 16, HEADH = 82;
  var availW = W - M*2;
  var styleMap = {};
  LCOLS.forEach(function(c){ styleMap[c.k] = c; });
  var cols = visibleCols(model).map(function(c){
    var st = styleMap[c.k];
    return {k:c.k, t:hdrOf(model, c.k), w: st ? st.w : Math.max(0.9, (c.w || 120) / 110), al: st ? st.al : 'left'};
  });
  if(!cols.length) cols = LCOLS.slice();
  var wsum = cols.reduce(function(a,c){ return a + c.w; }, 0);
  var widths = cols.map(function(c){ return availW * c.w / wsum; });
  var rows = model.rows || [];

  setF(MCTX, 44, 700);
  var titleLines = wrapLines(MCTX, model.title || '行程表', availW);
  setF(MCTX, 19, 400);
  var ds = [];
  rows.forEach(function(r){ var v = norm(r.date); if(v && ds.indexOf(v) < 0) ds.push(v); });
  var metaStr = [model.sub, ds.length ? (ds[0] + (ds.length > 1 ? ' ~ ' + ds[ds.length-1] : '')) : ''].filter(Boolean).join('　|　');
  var metaLines = metaStr ? wrapLines(MCTX, metaStr, availW) : [];

  var sp = buildSpans(model);
  var cellLines = rows.map(function(){ return {}; });
  var cellNeed = rows.map(function(){ return {}; });
  setF(MCTX, FS, 400);
  rows.forEach(function(r, i){
    cols.forEach(function(c, ci){
      var v = c.k === 'seq' ? String(r.g || 1) : (r[c.k] || '');
      var raw = wrapLines(MCTX, v, widths[ci] - CPAD*2);
      var ls = raw.length ? raw : [''];
      cellLines[i][c.k] = ls;
      cellNeed[i][c.k] = ls.length * LH + CPAD*2;
    });
  });
  var hs = rows.map(function(){ return LH + CPAD*2; });
  rows.forEach(function(r, i){
    var mx = LH + CPAD*2;
    cols.forEach(function(c){ if(sp[c.k][i] === 1) mx = Math.max(mx, cellNeed[i][c.k]); });
    hs[i] = mx;
  });
  rows.forEach(function(r, i){
    cols.forEach(function(c){
      var n = sp[c.k][i];
      if(n > 1){
        var sum = 0;
        for(var j = i; j < i+n; j++) sum += hs[j];
        var want = cellNeed[i][c.k];
        if(want > sum){
          var add = (want - sum) / n;
          for(var j2 = i; j2 < i+n; j2++) hs[j2] += add;
        }
      }
    });
  });
  var tableH = HEADH;
  hs.forEach(function(v){ tableH += v; });

  // 页脚：纪律 + 名单
  var footW = (availW - 40) / 2;
  setF(MCTX, 17, 400);
  var ruleLines = model.rules ? wrapLines(MCTX, model.rules, footW - 40) : [];
  var crewLines = model.crew ? wrapLines(MCTX, crewListOf(model).join('、'), footW - 40) : [];
  var footH = (ruleLines.length || crewLines.length) ? (Math.max(ruleLines.length, crewLines.length) * 27 + 80) : 0;

  var titleH = titleLines.length * 58 + (metaLines.length ? metaLines.length * 28 + 10 : 0);
  var H = M + titleH + 34 + tableH + (footH ? 30 + footH : 0) + M - 10;
  return {W:W, H:H, M:M, FS:FS, LH:LH, CPAD:CPAD, HEADH:HEADH, widths:widths, rows:rows, hs:hs, sp:sp, cols:cols,
          cellLines:cellLines, titleLines:titleLines, metaLines:metaLines,
          titleH:titleH, tableH:tableH, footW:footW, footH:footH, ruleLines:ruleLines, crewLines:crewLines, ds:ds};
}
/* 表格版：自动挑一个既够宽（横屏）又尽量窄（字大）的画布宽度 */
function bestLandscape(model){
  var last = null;
  for(var w = 2200; w <= 6200; w += 300){
    var L = buildLandscape(model, w);
    last = L;
    if(L.W / L.H >= 1.25) return L;   // 宽高比 ≥ 1.25 视为横屏
  }
  return last;
}
function crewListOf(model){ return norm(model.crew).split(/[、,，\/\s]+/).filter(function(s){ return s && s !== '。'; }); }
/* 图片里 "/" 视为无内容，不渲染 */
function meaningful(v){ var s = norm(v); return s && s !== '/' && s !== '／' ? s : ''; }

function paintLandscape(ctx, L){
  var M = L.M, y = M;
  // 标题
  setF(ctx, 44, 700);
  drawLines(ctx, L.titleLines, M, y, 58, NAVY, 'center', L.W - M*2);
  y += L.titleLines.length * 58;
  // 金色分隔
  ctx.fillStyle = GOLD;
  ctx.fillRect((L.W - 150)/2, y + 8, 150, 4);
  y += 22;
  if(L.metaLines.length){
    setF(ctx, 19, 400);
    drawLines(ctx, L.metaLines, M, y, 28, MUTE, 'center', L.W - M*2);
    y += L.metaLines.length * 28 + 10;
  }
  y = M + L.titleH + 34;

  // 表头
  var x = M;
  ctx.fillStyle = NAVY;
  ctx.fillRect(M, y, L.W - M*2, L.HEADH);
  setF(ctx, 22, 700);
  L.cols.forEach(function(c, ci){
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.t || hdrOf(doc, c.k), x + L.widths[ci]/2, y + L.HEADH/2);
    x += L.widths[ci];
  });
  y += L.HEADH;

  // 表体
  L.rows.forEach(function(r, i){
    var gc = gcolor(r.g || 1);
    var h = L.hs[i];
    var cx = M;
    var first = i > 0 && (L.rows[i-1].g || 1) !== (r.g || 1);
    L.cols.forEach(function(c, ci){
      var n = L.sp[c.k][i];
      if(!n) { cx += L.widths[ci]; return; }
      var w = L.widths[ci];
      var ch = 0;
      for(var j = i; j < i + n; j++) ch += L.hs[j];
      // 背景
      if(c.k === 'seq'){ ctx.fillStyle = tint(gc, 0.1); ctx.fillRect(cx, y, w, ch); }
      else if(c.k === 'date'){ ctx.fillStyle = '#fbfcfe'; ctx.fillRect(cx, y, w, ch); }
      // 边框
      ctx.strokeStyle = LINE; ctx.lineWidth = 1;
      ctx.strokeRect(cx + .5, y + .5, w - 1, ch - 1);
      // 文本
      var lines = L.cellLines[i][c.k];
      var txtH = lines.length * L.LH;
      var ty = y + (ch - txtH)/2;
      if(c.k === 'seq'){
        setF(ctx, 25, 700);
        var bh2 = 50, bw2 = 50;
        ctx.fillStyle = gc;
        rrect(ctx, cx + (w - bw2)/2, y + (ch - bh2)/2, bw2, bh2, 12); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(r.g||1), cx + w/2, y + ch/2 + 1);
      }else{
        var col = INK, wt = 500, sz = L.FS;
        if(c.k === 'phase'){ setF(ctx, L.FS, 700); col = gc; }
        else if(c.k === 'date'){ setF(ctx, L.FS - 3, 600); col = '#39465a'; }
        else if(c.k === 'time'){ setF(ctx, L.FS - 2, 700); col = '#6a4a08'; }
        else if(c.k === 'disp'){ setF(ctx, L.FS - 1, 600); col = '#274067'; }
        else if(c.k === 'note'){ setF(ctx, L.FS - 1, 500); col = '#47546a'; }
        else if(c.k === 'mid'){ setF(ctx, L.FS - 2, 500); col = '#6a4a08'; }
        else if(c.k === 'staff'){ setF(ctx, L.FS - 1, 500); col = '#2e3d54'; }
        else { setF(ctx, sz, wt); }
        drawLines(ctx, lines, cx + L.CPAD, ty, L.LH, col, c.al, w - L.CPAD*2);
      }
      cx += w;
    });
    // 环节分隔线
    if(first){
      ctx.strokeStyle = tint(gcolor(r.g||1), .55); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(M, y + 1); ctx.lineTo(M + L.W - M*2, y + 1); ctx.stroke();
    }
    y += h;
  });

  // 页脚
  if(L.footH){
    y += 24;
    var fx = M;
    var fbW = L.footW;
    [['会场纪律', L.ruleLines], ['会务人员名单（共 ' + crewListOf(doc).length + ' 人）', L.crewLines]].forEach(function(pair, idx){
      if(!pair[1].length) return;
      var bx = M + idx * (fbW + 40);
      ctx.fillStyle = '#fbfcfe'; ctx.fillRect(bx, y, fbW, L.footH);
      ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.strokeRect(bx + .5, y + .5, fbW - 1, L.footH - 1);
      ctx.fillStyle = NAVY; ctx.fillRect(bx, y, 4, L.footH);
      setF(ctx, 18, 700);
      ctx.fillStyle = NAVY; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(pair[0], bx + 24, y + 20);
      setF(ctx, 17, 400);
      drawLines(ctx, pair[1], bx + 24, y + 56, 27, SUBINK, 'left', fbW - 44);
    });
  }
  // 右下角水印
  setF(ctx, 14, 400);
  ctx.fillStyle = '#b8c3d2'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(new Date().toLocaleDateString('zh-CN') + ' · 行程排期台账', L.W - L.M, L.H - 18);
}

/* ---------- 竖版（手机 / 微信分享） ---------- */
function buildPortrait(model){
  var W = 1080, M = 56, cw = W - M*2;
  var rows = model.rows || [];
  var ds = [];
  rows.forEach(function(r){ var v = norm(r.date); if(v && ds.indexOf(v) < 0) ds.push(v); });

  // 分组
  var groups = [];
  rows.forEach(function(r){
    var g = r.g || 1, last = groups[groups.length-1];
    if(!last || last.g !== g) groups.push({g:g, items:[]});
    groups[groups.length-1].items.push(r);
  });

  var FS = 24, LH = 36, LBL = 18;
  setF(MCTX, FS, 500);
  // 逐组计算
  var blocks = groups.map(function(G){
    var f = G.items[0];
    var gds = [];
    G.items.forEach(function(r){ var v = norm(r.date); if(v && gds.indexOf(v) < 0) gds.push(v); });
    var head = 106;
    var rowsL = G.items.map(function(r){
      var out = [];
      // 主字段：标签在上
      [['工作职责','duty',false],['注意事项','note',true]].forEach(function(p){
        var v = meaningful(r[p[1]]); if(!v) return;
        setF(MCTX, FS, 500);
        var ls = wrapLines(MCTX, v, cw - 56);
        out.push({type:'stack', label:p[0], lines:ls, note:!!p[2],
                  h: 27 + ls.length * (p[2] ? 35 : 38) + 9});
      });
      // 短字段：合并成一行内联
      var parts = [];
      [['拆阳','staff'],['调度','disp'],['中阳','mid']].forEach(function(p){
        var v = meaningful(r[p[1]]); if(v) parts.push({l:p[0], v:v});
      });
      if(parts.length){
        setF(MCTX, 21, 500);
        var plain = parts.map(function(x){ return x.l + ' ' + x.v; }).join('　·　');
        var ls2 = wrapLines(MCTX, plain, cw - 56);
        out.push({type:'inline', parts:parts, lines:ls2, h: ls2.length * 33 + 9});
      }
      var tagH = (norm(r.time) || norm(r.place)) ? 44 : 0;
      var h = tagH + out.reduce(function(a,b){ return a + b.h; }, 0) + 14;
      return {r:r, fields:out, tagH:tagH, h:h};
    });
    var bodyH = rowsL.reduce(function(a,b){ return a + b.h; }, 0);
    return {g:G.g, f:f, gds:gds, head:head, rowsL:rowsL, h: head + bodyH + 20};
  });

  setF(MCTX, 16, 400);
  var metaStr = [model.sub].filter(Boolean).join('');
  var metaLines = metaStr ? wrapLines(MCTX, metaStr, cw) : [];

  setF(MCTX, 46, 700);
  var titleLines = wrapLines(MCTX, model.title || '行程表', cw - 8);

  setF(MCTX, 20, 400);
  var ruleLines = model.rules ? wrapLines(MCTX, model.rules, cw - 60) : [];
  var crewArr = crewListOf(model);
  var crewLines = crewArr.length ? wrapLines(MCTX, crewArr.join('、'), cw - 60) : [];

  var headH = 78 + titleLines.length * 58 + (metaLines.length ? metaLines.length * 26 + 16 : 0) + 66;
  var footH = (ruleLines.length || crewLines.length)
    ? 28 + 42 + ruleLines.length * 30 + 26 + 42 + crewLines.length * 30 + 26 : 0;
  var H = headH + 36 + blocks.reduce(function(a,b){ return a + b.h + 20; }, 0) + footH + 20 + 78;
  return {W:W, H:H, M:M, cw:cw, FS:FS, LH:LH, LBL:LBL, headH:headH, footH:footH, titleLines:titleLines,
          metaLines:metaLines, blocks:blocks, ruleLines:ruleLines, crewLines:crewLines,
          crewArr:crewArr, ds:ds};
}
function paintPortrait(ctx, P){
  var M = P.M, cw = P.cw, x = M, y = 0, W = P.W;

  // 顶部深蓝头
  var grad = ctx.createLinearGradient(0, 0, W, P.headH);
  grad.addColorStop(0, '#16294a'); grad.addColorStop(.55, '#1d3560'); grad.addColorStop(1, '#22406f');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, P.headH);
  ctx.fillStyle = GOLD; ctx.fillRect(0, P.headH - 4, W, 4);

  setF(ctx, 46, 700);
  drawLines(ctx, P.titleLines, M, 64, 58, '#fff', 'left', cw);
  var ty = 64 + P.titleLines.length * 58 + 12;
  if(P.metaLines.length){
    setF(ctx, 18, 400);
    drawLines(ctx, P.metaLines, M, ty, 27, 'rgba(255,255,255,.72)', 'left', cw);
    ty += P.metaLines.length * 27;
  }
  // 日期 + 环节数
  setF(ctx, 20, 600);
  var quick = (P.ds.length ? (P.ds[0] + (P.ds.length > 1 ? ' ~ ' + P.ds[P.ds.length-1] : '')) : '未填日期')
            + '　·　' + P.blocks.length + ' 个环节　·　' + (doc.rows||[]).length + ' 条安排';
  ctx.fillStyle = '#d9b45c'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(quick, M, P.headH - 62);

  y = P.headH + 36;

  P.blocks.forEach(function(B){
    var gc = gcolor(B.g);
    // 卡片
    ctx.fillStyle = '#fff';
    rrect(ctx, M, y, cw, B.h, 20); ctx.fill();
    ctx.strokeStyle = '#e6ecf4'; ctx.lineWidth = 1.4; ctx.stroke();
    // 左侧色条
    ctx.save();
    rrect(ctx, M, y, 10, B.h, 5); ctx.clip();
    ctx.fillStyle = gc; ctx.fillRect(M, y, 10, B.h);
    ctx.restore();

    // 卡片头
    ctx.fillStyle = tint(gc, .07);
    ctx.save(); rrect(ctx, M + 1, y + 1, cw - 2, B.head - 2, 19); ctx.clip();
    ctx.fillRect(M, y, cw, B.head); ctx.restore();

    // 序号徽章
    ctx.fillStyle = gc; rrect(ctx, M + 26, y + 22, 58, 58, 16); ctx.fill();
    setF(ctx, 28, 700);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(B.g), M + 55, y + 51);

    // 环节名
    setF(ctx, 31, 700);
    var pname = norm(B.f.phase) || '未命名环节';
    var pl = wrapLines(MCTX, pname, cw - 150);
    setF(ctx, 31, 700);
    drawLines(ctx, pl.slice(0,1), M + 102, y + 24, 38, gc, 'left', cw - 140);
    // 日期 · 调度
    setF(ctx, 20, 400);
    var sub = (B.gds.length ? B.gds.join(' · ') : '未填日期') + (meaningful(B.f.disp) ? '　调度：' + B.f.disp : '');
    drawLines(ctx, [sub], M + 102, y + 68, 26, MUTE, 'left', cw - 140);

    var ry = y + B.head;
    B.rowsL.forEach(function(R, ri){
      if(ri > 0){
        ctx.strokeStyle = '#eef2f8'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(M + 28, ry + 2); ctx.lineTo(M + cw - 22, ry + 2); ctx.stroke();
      }
      var cy = ry + 10;
      // tag
      if(R.tagH){
        var tx = M + 28;
        if(norm(R.r.time)){
          setF(ctx, 20, 650);
          var tw = MCTX.measureText(R.r.time).width + 28;
          ctx.fillStyle = '#faf3e2'; rrect(ctx, tx, cy, tw, 36, 9); ctx.fill();
          ctx.fillStyle = '#7d5a12'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(R.r.time, tx + 14, cy + 19);
          tx += tw + 10;
        }
        if(norm(R.r.place)){
          setF(ctx, 20, 500);
          var pw = MCTX.measureText(R.r.place).width + 28;
          ctx.fillStyle = '#eaf0ff'; rrect(ctx, tx, cy, pw, 36, 9); ctx.fill();
          ctx.fillStyle = '#2f4b7c'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(R.r.place, tx + 14, cy + 19);
        }
        cy += 44;
      }
      R.fields.forEach(function(F){
        if(F.type === 'stack'){
          setF(ctx, P.LBL, 600);
          ctx.fillStyle = MUTE; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
          ctx.fillText(F.label, M + 28, cy);
          cy += 27;
          setF(ctx, P.FS, 500);
          drawLines(ctx, F.lines, M + 28, cy, F.note ? 35 : 38, F.note ? SUBINK : INK, 'left', cw - 56);
          cy += F.lines.length * (F.note ? 35 : 38) + 9;
        }else{
          setF(ctx, 21, 500);
          drawLines(ctx, F.lines, M + 28, cy, 33, '#2e3d54', 'left', cw - 56);
          cy += F.lines.length * 33 + 9;
        }
      });
      ry += R.h;
    });
    y += B.h + 20;
  });

  // 页脚
  if(P.ruleLines.length || P.crewLines.length){
    var fh = P.footH;
    ctx.fillStyle = '#fbfcfe'; rrect(ctx, M, y, cw, fh, 20); ctx.fill();
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.4; ctx.stroke();
    var fy = y + 28;
    setF(ctx, 22, 700);
    ctx.fillStyle = NAVY; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('会场纪律', M + 30, fy); fy += 42;
    setF(ctx, 20, 400);
    drawLines(ctx, P.ruleLines, M + 30, fy, 30, SUBINK, 'left', cw - 60);
    fy += P.ruleLines.length * 30 + 26;
    setF(ctx, 22, 700);
    ctx.fillStyle = NAVY; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('会务人员名单（共 ' + P.crewArr.length + ' 人）', M + 30, fy); fy += 42;
    setF(ctx, 20, 400);
    drawLines(ctx, P.crewLines, M + 30, fy, 30, SUBINK, 'left', cw - 60);
    y += fh + 20;
  }

  setF(ctx, 18, 400);
  ctx.fillStyle = '#b8c3d2'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('行程排期台账 · ' + new Date().toLocaleDateString('zh-CN'), P.W/2, P.H - 58);
}

/* ---------- 时间轴版（横向一览，字最大） ---------- */
function buildTimeImage(model){
  var W = 1900, M = 60, LABW = 300, GAP = 20;
  var rowH = 62, barH = 40;
  var trackW = W - M*2 - LABW - GAP;

  var items = [], curDate = '', curPhase = '';
  (model.rows || []).forEach(function(r){
    if(norm(r.date)) curDate = norm(r.date);
    if(norm(r.phase)) curPhase = norm(r.phase);
    var rg = timeRange(r.time);
    if(!rg) return;
    items.push({r:r, d:curDate || '未填日期', ph:norm(r.phase) || curPhase,
                s:rg.s, e:Math.max(rg.e, rg.s + 10)});
  });

  var days = [], map = {};
  items.forEach(function(x){
    if(!map[x.d]){ map[x.d] = {d:x.d, items:[]}; days.push(map[x.d]); }
    map[x.d].items.push(x);
  });
  days.forEach(function(d){ d.items.sort(function(a,b){ return a.s - b.s; }); });

  setF(MCTX, 20, 400);
  days.forEach(function(day){
    var minS = Math.min.apply(null, day.items.map(function(x){ return x.s; }));
    var maxE = Math.max.apply(null, day.items.map(function(x){ return x.e; }));
    day.from = Math.floor(minS / 30) * 30 - 30;
    day.to = Math.ceil(maxE / 30) * 30 + 30;
    if(day.to - day.from < 120) day.to = day.from + 120;
    var hours = (day.to - day.from) / 60;
    var maxTicks = Math.max(3, Math.floor(trackW / 150));
    var step = 0.5;
    [0.5, 1, 2, 3, 4, 6].some(function(st){ step = st; return (hours / st) <= maxTicks; });
    day.ticks = [];
    for(var m = Math.ceil(day.from / (step*60)) * step*60; m <= day.to; m += step*60) day.ticks.push(m);
    day.pct = function(mm){ return (mm - day.from) / (day.to - day.from) * trackW; };
    day.h = 38 + 34 + day.items.length * rowH + 22;
  });

  setF(MCTX, 44, 700);
  var titleLines = wrapLines(MCTX, model.title || '行程表', W - M*2);
  var ds = [];
  (model.rows||[]).forEach(function(r){ var v = norm(r.date); if(v && ds.indexOf(v) < 0) ds.push(v); });
  setF(MCTX, 19, 400);
  var metaStr = [model.sub, ds.length ? (ds[0] + (ds.length>1 ? ' ~ ' + ds[ds.length-1] : '')) : '',
                 items.length + ' 项安排'].filter(Boolean).join('　|　');
  var metaLines = metaStr ? wrapLines(MCTX, metaStr, W - M*2) : [];

  var headH = M + titleLines.length * 58 + 22 + (metaLines.length ? metaLines.length*28 + 10 : 0) + 34;
  var bodyH = days.reduce(function(a,d){ return a + d.h; }, 0);
  var H = headH + bodyH + 70;

  return {W:W, H:H, M:M, LABW:LABW, GAP:GAP, trackW:trackW, rowH:rowH, barH:barH,
          days:days, titleLines:titleLines, metaLines:metaLines, headH:headH, count:items.length};
}

function paintTimeImage(ctx, L){
  var M = L.M, y = M;
  setF(ctx, 44, 700);
  drawLines(ctx, L.titleLines, M, y, 58, NAVY, 'center', L.W - M*2);
  y += L.titleLines.length * 58;
  ctx.fillStyle = GOLD;
  ctx.fillRect((L.W - 150)/2, y + 6, 150, 4);
  y += 22;
  if(L.metaLines.length){
    setF(ctx, 19, 400);
    drawLines(ctx, L.metaLines, M, y, 28, MUTE, 'center', L.W - M*2);
    y += L.metaLines.length * 28 + 10;
  }
  y = L.headH;

  var labX = M, trackX = M + L.LABW + L.GAP;

  L.days.forEach(function(day){
    // 日期标题
    setF(ctx, 27, 700);
    ctx.fillStyle = NAVY; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(day.d, labX, y + 26);
    setF(MCTX, 27, 700);
    var w0 = MCTX.measureText(day.d).width;
    setF(ctx, 19, 400);
    ctx.fillStyle = MUTE;
    ctx.fillText(day.items.length + ' 项　' + fmtHM(day.from) + ' - ' + fmtHM(day.to), labX + w0 + 20, y + 26);
    y += 38;

    // 刻度
    setF(ctx, 16, 400);
    day.ticks.forEach(function(mm){
      var x = trackX + day.pct(mm);
      ctx.fillStyle = '#eef2f8';
      ctx.fillRect(x, y + 22, 1, day.items.length * L.rowH + 8);
      ctx.fillStyle = '#a8b4c4';
      ctx.textAlign = mm === day.from ? 'left' : 'center';
      ctx.fillText(fmtHM(mm), x, y + 14);
    });
    y += 34;

    // 行
    var lastPh = null;
    var lastDayPh = null;
    day.items.forEach(function(x){
      var gc = gcolor(x.r.g || 1);
      var name = x.ph || norm(x.r.phase) || norm(x.r.duty) || '安排';
      var showName = name !== lastDayPh;
      lastDayPh = name;
      // 左侧名称：同一环节只在首行标一次
      if(name !== lastPh){
        setF(MCTX, 20, 700);
        var nl = wrapLines(MCTX, name, L.LABW - 8);
        setF(ctx, 20, 700);
        var nTxt = nl.slice(0, 2);
        var nH = nTxt.length * 24;
        drawRight(ctx, nTxt, labX + L.LABW - 8, y + (L.rowH - nH) / 2, 24, '#2b3a52');
      }else{
        // 同组的延续行：画浅色连接线
        ctx.fillStyle = '#e6ecf4';
        ctx.fillRect(labX + L.LABW - 22, y + 8, 2, L.rowH - 16);
      }
      lastPh = name;

      // 条形
      var bx = trackX + day.pct(x.s);
      var bw = Math.max(10, day.pct(x.e) - day.pct(x.s));
      var by = y + (L.rowH - L.barH) / 2;
      ctx.fillStyle = gc;
      rrect(ctx, bx, by, bw, L.barH, 10); ctx.fill();

      var tstr = norm(x.r.time);
      var barLabel = meaningful(x.r.duty) || name;
      var showLabel = !!(barLabel && barLabel !== '安排');
      setF(MCTX, 17, 600);
      var lw = showLabel ? MCTX.measureText(barLabel).width : 0;
      setF(MCTX, 17, 700);
      var tw = MCTX.measureText(tstr).width;
      var rightEdge = bx + bw;      // 条右侧已被占用的最远位置

      var outsideTxt = '';
      if(showLabel && bw >= lw + tw + 44){
        // 够宽：职责在左、时间在右，都在条内
        ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
        setF(ctx, 17, 600); ctx.textAlign = 'left';
        ctx.fillText(barLabel, bx + 13, by + L.barH/2 + 1);
        setF(ctx, 17, 700); ctx.textAlign = 'right';
        ctx.fillText(tstr, bx + bw - 13, by + L.barH/2 + 1);
        ctx.textAlign = 'left';
      }else if(bw >= tw + 26){
        // 只放得下时间：时间进条内，职责写到条外
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tstr, bx + bw/2, by + L.barH/2 + 1);
        if(showLabel) outsideTxt = barLabel;
      }else{
        // 太窄：职责 + 时间都写到条外
        outsideTxt = showLabel ? (barLabel + '　' + tstr) : tstr;
      }

      if(outsideTxt){
        setF(ctx, 17, 600);
        setF(MCTX, 17, 600);
        var ow = MCTX.measureText(outsideTxt).width;
        ctx.fillStyle = gc; ctx.textBaseline = 'middle';
        if(bx + bw + 12 + ow <= L.W - L.M){
          ctx.textAlign = 'left';
          ctx.fillText(outsideTxt, bx + bw + 12, by + L.barH/2 + 1);
          rightEdge = bx + bw + 12 + ow;
        }else if(bx - 12 - ow >= L.M){
          ctx.textAlign = 'right';
          ctx.fillText(outsideTxt, bx - 12, by + L.barH/2 + 1);
        }
      }

      // 负责人（接在条/标签之后，放得下才画）
      var who = meaningful(x.r.disp);
      if(who){
        var after = rightEdge + 16;
        setF(ctx, 17, 500);
        setF(MCTX, 17, 500);
        var wTxt = MCTX.measureText(who).width;
        if(after + wTxt < L.W - M){
          ctx.fillStyle = '#7d5a12'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(who, after, by + L.barH/2 + 1);
        }
      }
      y += L.rowH;
    });
    y += 22;
  });

  setF(ctx, 15, 400);
  ctx.fillStyle = '#b8c3d2'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(new Date().toLocaleDateString('zh-CN') + ' · 行程排期台账', L.W - L.M, L.H - 22);
}
function fmtHM(m){
  var h = Math.floor(m / 60), mi = m % 60;
  return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
}
function drawRight(ctx, lines, right, top, lh, color){
  ctx.fillStyle = color; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  lines.forEach(function(t, i){ ctx.fillText(t, right, top + i * lh); });
}

/* ---------- 渲染成 PNG 并下载 ---------- */
function makeImage(mode){
  var model = doc;
  var L = (mode === 'portrait') ? buildPortrait(model)
        : (mode === 'timeline') ? buildTimeImage(model)
        : bestLandscape(model);
  var maxSide = 16000, maxArea = 30000000;
  var scale = 2;
  while((L.W*scale > maxSide || L.H*scale > maxSide || L.W*L.H*scale*scale > maxArea) && scale > 1){ scale -= 0.25; }
  var cv = document.createElement('canvas');
  cv.width = Math.round(L.W * scale);
  cv.height = Math.round(L.H * scale);
  var ctx = cv.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, L.W, L.H);
  ctx.textBaseline = 'top';
  if(mode === 'portrait') paintPortrait(ctx, L);
  else if(mode === 'timeline') paintTimeImage(ctx, L);
  else paintLandscape(ctx, L);
  return {canvas:cv, w:cv.width, h:cv.height, scale:scale};
}
function downloadImage(mode){

}

/* ================= 时间轴视图 ================= */
function renderTimeline(){
  var box = $('#timeBox');
  var items = [];
  var curDate = '', curPhase = '';
  doc.rows.forEach(function(r, i){
    if(norm(r.date)) curDate = norm(r.date);
    if(norm(r.phase)) curPhase = norm(r.phase);
    var rg = timeRange(r.time);
    if(!rg) return;
    items.push({i:i, r:r, d:curDate || '未填日期', ph:norm(r.phase) || curPhase,
                s:rg.s, e:Math.max(rg.e, rg.s + 10)});
  });
  if(!items.length){
    box.innerHTML = '<div class="empty">还没有带时间的安排。<br>在「时间」列填 <b>09:00-10:00</b> 这样的格式，这里就会自动画出来。</div>';
    return;
  }
  var days = [], map = {};
  items.forEach(function(x){
    if(!map[x.d]){ map[x.d] = {d:x.d, items:[]}; days.push(map[x.d]); }
    map[x.d].items.push(x);
  });
  days.forEach(function(d){ d.items.sort(function(a,b){ return a.s - b.s || a.i - b.i; }); });

  var t = new Date();
  var nowMin = t.getHours() * 60 + t.getMinutes();
  var todayStr = t.getFullYear() + '.' + pad2(t.getMonth() + 1) + '.' + pad2(t.getDate());

  var html = '';
  days.forEach(function(day){
    var minS = Math.min.apply(null, day.items.map(function(x){ return x.s; }));
    var maxE = Math.max.apply(null, day.items.map(function(x){ return x.e; }));
    var from = Math.floor(minS / 30) * 30 - 30;
    var to = Math.ceil(maxE / 30) * 30 + 30;
    var span = Math.max(60, to - from);
    var pct = function(m){ return (m - from) / span * 100; };

    var hours = span / 60;
    var nameW = window.innerWidth <= 980 ? 92 : 168;
    var availW = Math.max(180, box.clientWidth - nameW - 20);
    var maxTicks = Math.max(3, Math.floor(availW / 62));
    var step = 0.5;
    [0.5, 1, 2, 3, 4, 6].some(function(st){ step = st; return (hours / st) <= maxTicks; });
    var ticks = [];
    for(var m = Math.ceil(from / (step * 60)) * step * 60; m <= to; m += step * 60) ticks.push(m);
    var lab = function(mm){
      var h = Math.floor(mm / 60), mi = mm % 60;
      return h + ':' + pad2(mi);
    };

    html += '<div class="tl-day"><div class="tl-dh"><b>' + esc(day.d) + '</b><span>' + day.items.length + ' 项</span>' +
            '<span style="margin-left:auto;color:#b8c3d2">' + lab(from) + ' - ' + lab(to) + '</span></div>';
    html += '<div class="tl-canvas">';

    html += '<div class="tl-axis">';
    ticks.forEach(function(mm){
      var p = pct(mm);
      var st = p <= 1 ? 'left:0;transform:none'
             : (p >= 99 ? 'left:auto;right:0;transform:none'
             : 'left:' + p.toFixed(2) + '%');
      html += '<div class="tl-ax" style="' + st + '">' + lab(mm) + '</div>';
    });
    html += '</div>';

    html += '<div class="tl-grid">';
    ticks.forEach(function(mm){
      html += '<div class="tl-line" style="left:' + pct(mm).toFixed(2) + '%"></div>';
    });
    if(day.d === todayStr && nowMin >= from && nowMin <= to){
      html += '<div class="tl-now" style="left:' + pct(nowMin).toFixed(2) + '%"></div>';
    }
    html += '</div>';

    var lastDayPh = null;
    day.items.forEach(function(x){
      var gc = gcolor(x.r.g || 1);
      var name = x.ph || norm(x.r.phase) || norm(x.r.duty) || '安排';
      var showName = name !== lastDayPh;
      lastDayPh = name;
      var label = norm(x.r.duty) || name;
      var left = pct(x.s), w = Math.max(1.2, pct(x.e) - pct(x.s));
      var tip = [x.r.time, name, norm(x.r.place), norm(x.r.disp) ? '调度：' + norm(x.r.disp) : '']
                .filter(Boolean).join(' · ');
      var tTxt = '<em>' + esc(norm(x.r.time)) + '</em>';
      var inner = '', outside = '';
      if(w >= 13){
        inner = '<span class="lb">' + esc(label) + '</span>' + tTxt;
      }else{
        // 条太窄，字写到条外侧（否则会被 overflow:hidden 裁掉）
        var txt = (w >= 6.5 ? esc(label) : esc(label) + tTxt);
        if(left + w > 70){
          outside = '<span class="tl-out l" style="right:calc(' + (100 - left).toFixed(2) + '% + 8px);color:' + gc + '">' + txt + '</span>';
        }else{
          outside = '<span class="tl-out r" style="left:calc(' + (left + w).toFixed(2) + '% + 8px);color:' + gc + '">' + txt + '</span>';
        }
        if(w >= 6.5) inner = tTxt;   // 时间仍可放在条内
      }
      html += '<div class="tl-row">' +
        '<div class="tl-name' + (showName ? '' : ' cont') + '" title="' + esc(name) + '">' +
          (showName ? esc(name) : '') + '</div>' +
        '<div class="tl-track">' +
          '<div class="tl-bar" data-i="' + x.i + '" style="left:' + left.toFixed(2) + '%;width:' + w.toFixed(2) + '%;background:' + gc + '">' +
            inner +
          '</div>' + outside +
        '</div></div>';
    });
    html += '</div></div>';
  });
  box.innerHTML = html;
}

/* ================= 多选与批量 ================= */
var selRows = [];
function selKey(){ return selRows.slice().sort(function(a,b){ return a-b; }).join(','); }
function isSel(i){ return selRows.indexOf(i) >= 0; }
function paintSelection(){
  document.querySelectorAll('#tableBox tbody tr[data-i]').forEach(function(tr){
    tr.classList.toggle('selected', isSel(+tr.dataset.i));
  });
  var bar = $('#batchBar');
  if(selRows.length){
    $('#bSel').textContent = '已选 ' + selRows.length + ' 行';
    bar.classList.add('open');
  }else{
    bar.classList.remove('open');
  }
}
function toggleSel(i, range){
  if(range && selRows.length){
    var last = selRows[selRows.length - 1];
    var a = Math.min(last, i), b = Math.max(last, i);
    selRows = [];
    for(var k = a; k <= b; k++) selRows.push(k);
  }else{
    var at = selRows.indexOf(i);
    if(at >= 0) selRows.splice(at, 1); else selRows.push(i);
  }
  paintSelection();
}
function clearSel(){ selRows = []; paintSelection(); }

function batchAction(act){
  if(!selRows.length) return;
  var idx = selRows.slice().sort(function(a,b){ return a-b; });
  if(act === 'clear'){ clearSel(); return; }
  if(act === 'dup'){
    pushUndo();
    var add = [];
    idx.forEach(function(i){ var c = clone(doc.rows[i]); c.g = (doc.rows[i].g||1); add.push(c); });
    // 插到最后一个被选行之后
    var tail = idx[idx.length-1] + 1;
    doc.rows.splice.apply(doc.rows, [tail, 0].concat(add));
    renumber(); clearSel(); autosave(); renderAll(); toast('已复制 ' + add.length + ' 行');
    return;
  }
  if(act === 'del'){
    askConfirm('删除所选行？', '将删除 ' + idx.length + ' 行，可用撤销找回。', function(){
      pushUndo();
      for(var i = idx.length - 1; i >= 0; i--) doc.rows.splice(idx[i], 1);
      renumber(); clearSel(); autosave(); renderAll(); toast('已删除 ' + idx.length + ' 行');
    }, true);
    return;
  }
  if(act === 'up' || act === 'down'){
    var dir = act === 'up' ? -1 : 1;
    var seq = dir < 0 ? idx : idx.slice().reverse();
    var moved = false;
    seq.forEach(function(i){
      var j = i + dir;
      if(j < 0 || j >= doc.rows.length || isSel(j)) return;
      var t = doc.rows[i]; doc.rows[i] = doc.rows[j]; doc.rows[j] = t;
      moved = true;
    });
    if(moved){
      pushUndo();
      selRows = selRows.map(function(i){ return i + dir; });
      autosave(); renderAll(); paintSelection();
    }
    return;
  }
  if(act === 'tonew'){
    pushUndo();
    var max = 0;
    doc.rows.forEach(function(r){ max = Math.max(max, r.g || 1); });
    idx.forEach(function(i){ doc.rows[i].g = max + 1; });
    renumber(); clearSel(); autosave(); renderAll(); toast('已移入新环节');
  }
}

/* ================= 拖拽调整环节顺序 ================= */
var dragState = null;
function rowEls(){
  return Array.prototype.slice.call(document.querySelectorAll('#tableBox tbody tr[data-i]'));
}
function groupBlocks(){
  var rows = doc.rows, out = [], i = 0;
  while(i < rows.length){
    var g = rows[i].g || 1, j = i + 1;
    while(j < rows.length && (rows[j].g || 1) === g) j++;
    out.push({g:g, start:i, end:j - 1});
    i = j;
  }
  return out;
}
function onSeqDown(e){
  if(e.button !== 0) return;
  var td = e.target.closest('td.c-seq');
  if(!td) return;
  var tr = td.closest('tr');
  if(!tr) return;
  var i = +tr.dataset.i;
  dragState = {i:i, x:e.clientX, y:e.clientY, moved:false,
               g:doc.rows[i].g||1, whole:!!e.altKey, target:null};
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragUp, {once:true});
}
function ensureDropLine(){
  var line = document.getElementById('dropLine');
  if(!line){
    line = document.createElement('div');
    line.id = 'dropLine';
    line.className = 'drop-line';
    document.getElementById('tableBox').appendChild(line);
  }
  return line;
}
function onDragMove(e){
  if(!dragState) return;
  if(!dragState.moved){
    if(Math.abs(e.clientY - dragState.y) < 6 && Math.abs(e.clientX - dragState.x) < 6) return;
    dragState.moved = true;
    document.body.style.userSelect = 'none';
    document.querySelectorAll('#tableBox tbody tr[data-i]').forEach(function(tr){
      var i = +tr.dataset.i;
      if(dragState.whole ? ((doc.rows[i].g || 1) === dragState.g) : (i === dragState.i)) tr.classList.add('drag-src');
    });
  }
  var els = rowEls();
  var best = null, bestD = 1e9;
  if(dragState.whole){
    groupBlocks().forEach(function(b){
      [[b.start, 'before', b.start], [b.end, 'after', b.end + 1]].forEach(function(p){
        var el = els[p[0]];
        if(!el) return;
        var r = el.getBoundingClientRect();
        var y = p[1] === 'before' ? r.top : r.bottom;
        var d = Math.abs(e.clientY - y);
        if(d < bestD){ bestD = d; best = {y:y, at:p[2], block:b}; }
      });
    });
  }else{
    els.forEach(function(el, idx){
      var r = el.getBoundingClientRect();
      [[r.top, idx], [r.bottom, idx + 1]].forEach(function(p){
        var d = Math.abs(e.clientY - p[0]);
        if(d < bestD){ bestD = d; best = {y:p[0], at:p[1]}; }
      });
    });
  }
  if(!best) return;
  dragState.target = best;
  var line = ensureDropLine();
  var boxRect = document.getElementById('tableBox').getBoundingClientRect();
  var sc = document.getElementById('tableBox');
  line.style.top = (best.y - boxRect.top + sc.scrollTop - 1) + 'px';
  line.style.display = 'block';
}
function onDragUp(){
  document.removeEventListener('mousemove', onDragMove);
  document.body.style.userSelect = '';
  var st = dragState;
  dragState = null;
  var line = document.getElementById('dropLine');
  if(line) line.style.display = 'none';
  document.querySelectorAll('#tableBox tbody tr').forEach(function(tr){ tr.classList.remove('drag-src'); });
  if(!st || !st.moved) { if(st) toggleSel(st.i, false); return; }
  var tgt = st.target;
  if(!tgt) return;
  var s0, s1;
  if(st.whole){
    var blk = null;
    groupBlocks().forEach(function(b){ if(b.g === st.g) blk = b; });
    if(!blk) return;
    s0 = blk.start; s1 = blk.end;
  }else{
    s0 = s1 = st.i;
  }
  var at = tgt.at;                                  // 原数组中的插入位置
  if(at >= s0 && at <= s1 + 1) return;              // 落在自己身上
  pushUndo();
  var moving = doc.rows.splice(s0, s1 - s0 + 1);
  if(at > s1) at -= moving.length;
  if(!st.whole && moving.length === 1){
    var prev = doc.rows[at - 1], next = doc.rows[at];
    var g = prev ? (prev.g || 1) : (next ? (next.g || 1) : 1);
    moving[0].g = g;                                // 单行移动：并入相邻环节
  }
  doc.rows.splice.apply(doc.rows, [at, 0].concat(moving));
  renumber(); clearSel(); autosave(); renderAll();
  toast(st.whole ? '已移动整个环节' : '已移动这一行');
}

/* ================= 数据体检 ================= */
function runCheck(){
  var issues = [];
  doc.rows.forEach(function(r, i){
    var d = norm(r.date), t = norm(r.time);
    if(d && !/^\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2}$/.test(d))
      issues.push({i:i, msg:'日期格式可能不规范：<b>' + esc(d) + '</b>（建议 2026.10.21）'});
    if(t && t !== '/'){
      if(!timeRange(t) && !/^\d{1,2}[:：]\d{2}$/.test(t))
        issues.push({i:i, msg:'时间格式可能不规范：<b>' + esc(t) + '</b>（建议 09:00-10:00）'});
      else{
        var rg = timeRange(t);
        if(rg && rg.e > rg.s && (rg.e - rg.s) > 12 * 60)
          issues.push({i:i, msg:'时间跨度超过 12 小时：<b>' + esc(t) + '</b>'});
        if(rg && rg.e < rg.s)
          issues.push({i:i, msg:'结束时间早于开始时间：<b>' + esc(t) + '</b>'});
      }
    }
    var isHead = i === 0 || (doc.rows[i-1].g || 1) !== (r.g || 1);
    if(isHead && !norm(r.phase) && !norm(r.duty))
      issues.push({i:i, msg:'环节第 ' + (r.g||1) + ' 组没有名称，也没有主要职责'});
    if(!norm(r.duty) && !norm(r.phase) && !norm(r.place) && !norm(r.time))
      issues.push({i:i, msg:'这一行没有任何内容，可能是多余的空行'});
  });
  var box = $('#mBody');
  if(!issues.length){
    modal('数据体检', '<div class="dlg" style="text-align:center;padding:18px 0">' +
      '<div style="font-size:34px;line-height:1;margin-bottom:10px">✅</div>' +
      '<b style="color:#0f9b57">没有发现问题</b><br><span style="font-size:12px;color:#8b98ac">共检查 ' + doc.rows.length + ' 行</span></div>',
      null, {hideOk:true, cancelText:'知道了'});
    return;
  }
  modal('数据体检 · 发现 ' + issues.length + ' 处',
    '<div class="prevbar" style="margin:-18px -20px 10px;border-radius:0">点一条可直接跳到对应行</div>' +
    '<div style="max-height:52vh;overflow:auto">' +
      issues.map(function(x, n){
        return '<div class="chk-item" data-jump="' + x.i + '"><span class="ci">' + (n+1) + '</span>' +
               '<span class="ct"><b>第 ' + (x.i+1) + ' 行</b>　' + x.msg + '</span></div>';
      }).join('') +
    '</div>',
    null, {hideOk:true, cancelText:'关闭'});
  box.querySelectorAll('[data-jump]').forEach(function(el){
    el.addEventListener('click', function(){
      var i = +el.dataset.jump;
      closeModal();
      setView('table');
      setTimeout(function(){
        var tr = document.querySelector('#tableBox tbody tr[data-i="' + i + '"]');
        if(tr){
          tr.scrollIntoView({block:'center', behavior:'smooth'});
          tr.classList.add('row-hl');
          setTimeout(function(){ tr.classList.remove('row-hl'); }, 2200);
        }
      }, 120);
    });
  });
}

function b64url(buf){
  var s = '';
  var bytes = new Uint8Array(buf);
  for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length % 4) str += '=';
  var bin = atob(str), out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function packDoc(obj){
  var json = JSON.stringify(obj);
  if(window.CompressionStream){
    try{
      var cs = new CompressionStream('deflate-raw');
      var blob = await new Response(new Blob([json]).stream().pipeThrough(cs)).blob();
      var buf = await blob.arrayBuffer();
      return 'z' + b64url(buf);
    }catch(e){}
  }
  return 'j' + b64url(new TextEncoder().encode(json).buffer);
}
async function unpackDoc(str){
  var kind = str.charAt(0), body = str.slice(1);
  var bytes = unb64url(body);
  var json;
  if(kind === 'z'){
    var ds = new DecompressionStream('deflate-raw');
    var blob = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).blob();
    json = await blob.text();
  }else{
    json = new TextDecoder().decode(bytes);
  }
  return JSON.parse(json);
}
async function makeShareLink(){
  try{
    var payload = {
      v: 1,
      title: doc.title, sub: doc.sub,
      cols: doc.cols, colOrder: doc.colOrder, hideCols: doc.hideCols,

    var code = await packDoc(payload);

}

var curColKey = null, hoverIdx = -1;
function showRowTools(tr, anchor){
  var idx = +tr.dataset.i;
  if(!isFinite(idx)) return;
  var rt = $('#rowTools');
  rt.querySelectorAll('[data-act]').forEach(function(b){ b.dataset.i = idx; });
  var mobile = window.matchMedia && window.matchMedia('(max-width:980px)').matches;
  if(mobile){
    rt.style.left = '50%';
    rt.style.transform = 'translateX(-50%)';
    rt.style.top = (window.innerHeight - 66) + 'px';
  }else{
    var base = (anchor || tr).getBoundingClientRect();
    var h = 34;
    var top = base.top + base.height / 2 - h / 2;
    var left = base.right + 4;
    rt.style.transform = 'none';
    rt.style.top = Math.max(8, Math.min(top, window.innerHeight - h - 8)) + 'px';
    rt.style.left = Math.max(8, Math.min(left, window.innerWidth - 136)) + 'px';
  }
  rt.classList.add('open');
  hoverIdx = idx;
  hideColTools();
}

  curColKey = th.dataset.hk;

  var ct = $('#colTools');

  var w = ct.offsetWidth || 180;
  ct.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  ct.style.top = (r.bottom + 5) + 'px';

  hideRowTools();

function newColKey(){ return 'x' + Date.now().toString(36).slice(-4) + Math.floor(Math.random() * 90 + 10); }
function addColumn(afterKey, side){
  var cols = getCols(doc).slice();
  var idx = cols.length - 1;
  if(afterKey){
    for(var i = 0; i < cols.length; i++){ if(cols[i].k === afterKey){ idx = i; break; } }
    if(side === 'left') idx = idx - 1;
  }
  var key = newColKey();
  pushUndo();
  cols.splice(idx + 1, 0, {k:key, t:'新列', w:130, al:'left'});
  doc.cols = cols;
  var order = fullOrder().filter(function(k){ return k !== key; });
  var pos = afterKey ? order.indexOf(afterKey) : order.length - 1;
  if(side === 'left' && pos >= 0) pos = pos - 1;
  order.splice(pos + 1, 0, key);
  doc.colOrder = order;
  autosave(); renderAll();
  setTimeout(function(){
    var th = document.querySelector('#tableBox thead th[data-hk="' + key + '"] .th');
    if(th){
      th.focus();
      try{

function removeColumn(k){
  if(k === 'seq'){ toast('序号列不能删除'); return; }

    pushUndo();
    doc.cols = cs.filter(function(c){ return c.k !== k; });

$('#colTools').addEventListener('click', function(e){
  var b = e.target.closest('[data-col]');
  if(!b || !curColKey) return;
  e.preventDefault(); e.stopPropagation();
  var act = b.dataset.col;
  if(act === 'addl'){ hideColTools(); addColumn(curColKey, 'left'); return; }
  if(act === 'addr'){ hideColTools(); addColumn(curColKey, 'right'); return; }
  if(act === 'del'){ hideColTools(); removeColumn(curColKey); return; }
  var order = fullOrder();
  var i = order.indexOf(curColKey);
  if(i < 0) return;
  if(act === 'hide'){
    if(curColKey === 'seq'){ toast('序号列不能隐藏'); return; }
    if(visibleCols(doc).length <= 1){ toast('至少保留一列'); return; }
    pushUndo();
    doc.hideCols = (doc.hideCols || []).concat([curColKey]);
    doc.colOrder = order;
    autosave(); renderTable(); hideColTools();
    toast('已隐藏「' + hdrOf(doc, curColKey) + '」');
    return;
  }
  if(act === 'left' || act === 'right'){
    var j = act === 'left' ? i - 1 : i + 1;
    if(j < 0 || j >= order.length) return;
    pushUndo();
    var t = order[i]; order[i] = order[j]; order[j] = t;
    doc.colOrder = order;
    autosave(); renderTable();
    setTimeout(function(){
      var th = document.querySelector('#tableBox thead th[data-hk="' + curColKey + '"]');
      if(th) showColTools(th);
    }, 10);

});

var CLOUD = {
  on:false, canReg:true, user:null, token:'', docs:[], docId:null, version:0,
  suspend:false, timer:null, inflight:false, retryTimer:null, pendingJoin:''
};
var TOKEN_KEY = LS + '.token', DOC_KEY = LS + '.lastdoc', LOCAL_KEY = LS + '.localmode';

function api(path, opts){
  opts = opts || {};
  var h = { 'Content-Type':'application/json' };
  if(CLOUD.token) h.Authorization = 'Bearer ' + CLOUD.token;
  var init = { method: opts.method || 'GET', headers: h, cache:'no-store' };
  if(opts.body !== undefined) init.body = JSON.stringify(opts.body);
  return fetch(path, init).then(function(r){
    return r.text().then(function(t){
      var j = {}; try{ j = t ? JSON.parse(t) : {}; }catch(e){}
      if(r.status === 401 && CLOUD.user) cloudLogout(true);
      return { ok:r.ok, status:r.status, json:j };
    });
  }).catch(function(e){
    return { ok:false, status:0, json:{ error:'network', message:'连不上服务器' } };
  });
}

/* ---------- 进入云端 ---------- */
function cloudEnter(){
  return api('/api/docs').then(function(l){
    if(!l.ok){ toast(l.json.message || '读取活动列表失败'); return; }
    CLOUD.docs = l.json.docs || [];
    var joinCode = cloudPendingJoin();
    if(joinCode){
      return cloudJoin(joinCode).then(function(){
        setBadge();
        return cloudOpen(CLOUD.docId || (CLOUD.docs[0] && CLOUD.docs[0].id), true);
      });
    }
    if(!CLOUD.docs.length){
      var hasContent = (doc.rows || []).some(function(r){ return meaningful(r.duty) || meaningful(r.phase); });
      var title = doc.title || '我的行程表';
      return api('/api/docs', { method:'POST', body:{ title:title, data:doc } }).then(function(c){
        if(!c.ok){ toast('创建云端表失败'); return; }
        CLOUD.docId = c.json.id; CLOUD.version = c.json.version;
        try{ localStorage.setItem(DOC_KEY, CLOUD.docId); }catch(e){}
        return cloudRefresh().then(function(){
          var tip = hasContent ? '已把本地这张表同步到云端' : '已创建云端表';
          toast(tip); setSave('已同步 ' + stamp(), false);
          renderCloudSide();
        });
      });
    }
    var want = '';
    try{ want = localStorage.getItem(DOC_KEY) || ''; }catch(e){}
    var pick = CLOUD.docs.filter(function(d){ return d.id === want; })[0] || CLOUD.docs[0];
    return cloudOpen(pick.id, true).then(function(){ renderCloudSide(); });
  });
}

function cloudPendingJoin(){
  var m = (location.search || '').match(/[?&]join=([\w-]+)/);
  return m ? m[1] : '';
}
function cloudJoin(code){
  return api('/api/join', { method:'POST', body:{ code:code } }).then(function(r){
    if(!r.ok){ toast(r.json.message || '邀请码无效'); return; }
    history.replaceState(null, '', location.pathname);
    return cloudRefresh().then(function(){ return cloudOpen(r.json.docId); }).then(function(){
      toast('已加入「' + (r.json.title || '这份表') + '」');
    });
  });
}

function cloudRefresh(){
  return api('/api/docs').then(function(l){
    if(l.ok) CLOUD.docs = l.json.docs || [];
    renderCloudSide();
  });
}

function cloudOpen(id, silent){
  return api('/api/docs/' + id).then(function(r){
    if(!r.ok){ toast(r.json.message || '打不开这份表'); return; }
    CLOUD.suspend = true;
    doc = normalizeDoc(r.json.data || {});
    curId = null;
    CLOUD.docId = id; CLOUD.version = r.json.version;
    touched = false;
    try{ localStorage.setItem(DOC_KEY, id); }catch(e){}
    paint(); renderAll(); persist();
    CLOUD.suspend = false;
    clearSel();
    if(!silent) toast('已打开：' + (r.json.title || ''));
  });
}

/* ---------- 保存 ---------- */
function cloudQueueSave(){
  if(!CLOUD.on || !CLOUD.user || !CLOUD.docId || CLOUD.suspend) return;
  clearTimeout(CLOUD.timer);
  setSave('同步中…', true);
  CLOUD.timer = setTimeout(cloudFlush, 1200);
}

function cloudFlush(){
  if(!CLOUD.on || !CLOUD.user || !CLOUD.docId || CLOUD.inflight) return Promise.resolve();
  CLOUD.inflight = true;
  var body = { title: doc.title, data: doc, version: CLOUD.version };
  return api('/api/docs/' + CLOUD.docId, { method:'PUT', body: body }).then(function(r){
    CLOUD.inflight = false;
    if(r.ok){
      CLOUD.version = r.json.version;
      setSave('已同步 ' + stamp(), false);
      CLOUD.docs.forEach(function(d){ if(d.id === CLOUD.docId){ d.title = doc.title; d.version = r.json.version; d.updated_at = r.json.updated_at; } });
      renderCloudSide();
    }else if(r.status === 409){
      setSave('有冲突待处理', true);
      cloudConflict(r.json.current || {});
    }else if(r.status === 0){
      setSave('离线，稍后重试', true);
      clearTimeout(CLOUD.retryTimer);
      CLOUD.retryTimer = setTimeout(cloudFlush, 6000);
    }else{
      setSave('同步失败', true);
      toast(r.json.message || '保存到云端失败');
    }
  });
}

function cloudSaveNow(){
  cloudFlush().then(function(){ toast('已同步到云端'); });
}

function cloudConflict(cur){
  var when = cur && cur.updated_at ? new Date(cur.updated_at).toLocaleString('zh-CN') : '';
  modal('这份表已被修改',

    function(){
      // 用我的覆盖：先取最新版本号，再按最新版本写入
      api('/api/docs/' + CLOUD.docId).then(function(g){
        if(!g.ok) return toast('取最新版本失败');
        CLOUD.version = g.json.version;
        cloudFlush();
      });
    }, { okText:'用我的覆盖', cancelText:'加载最新版', danger:true });

  var cbtn = document.getElementById('mCancel');
  var once = function(){
    cbtn.removeEventListener('click', once);

}

/* ---------- 侧栏（云端） ---------- */
function relTime(ts){
  var d = Math.floor((Date.now() - ts) / 1000);
  if(d < 60) return '刚刚';
  if(d < 3600) return Math.floor(d/60) + ' 分钟前';
  if(d < 86400) return Math.floor(d/3600) + ' 小时前';
  if(d < 86400*7) return Math.floor(d/86400) + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}
function renderCloudSide(){
  var box = $('#archList'); if(!box) return;
  box.innerHTML = '';
  if(!CLOUD.on || !CLOUD.user){
    var tip0 = el('div','','登录后，表和同事的协作都会显示在这里。');
    tip0.style.cssText = 'padding:16px 12px;font-size:12px;color:#8b98ac;line-height:1.8';
    box.appendChild(tip0);
    var si0 = $('#storeInfo'); if(si0) si0.textContent = '本地模式';
    var sc0 = $('#sideCount'); if(sc0) sc0.textContent = '';
    return;
  }
  if(!CLOUD.docs.length){
    var tip = el('div','','还没有云端活动，点「保存存档」把当前表存上去。');
    tip.style.cssText = 'padding:16px 12px;font-size:12px;color:#8b98ac;line-height:1.8';
    box.appendChild(tip);
  }
  CLOUD.docs.slice().sort(function(a,b){ return b.updated_at - a.updated_at; }).forEach(function(d){
    var card = el('div', 'arch' + (d.id === CLOUD.docId ? ' active' : ''));
    card.innerHTML =
      '<div class="t">' + esc(d.title || '未命名') + '</div>' +
      '<div class="tagline"><span class="tl gold">' + (d.role === 'owner' ? '我创建的' : '协作中') + '</span>' +
      '<span class="tl">v' + d.version + '</span></div>' +
      '<div class="m"><span class="dotg"></span><span>' + esc(relTime(d.updated_at)) +
      (d.updated_by ? ' · ' + esc(d.updated_by) : '') + '</span></div>' +
      '<div class="ops">' +
        '<button class="btn sm" data-c="open">打开</button>' +
        '<button class="btn sm" data-c="invite">邀请</button>' +
        '<button class="btn sm" data-c="ren">改名</button>' +
        '<button class="btn sm danger" data-c="del">删除</button>' +
      '</div>';
    card.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-c]');
      if(!b){ cloudOpen(d.id); return; }
      ev.stopPropagation();
      var a = b.dataset.c;
      if(a === 'open') cloudOpen(d.id);
      if(a === 'invite') cloudOpen(d.id).then(function(){ cloudInvite(); });
      if(a === 'ren') cloudRename(d);
      if(a === 'del') cloudDeleteDoc(d);
    });
    box.appendChild(card);
  });
  var si = $('#storeInfo'); if(si) si.textContent = '云端 · ' + CLOUD.docs.length + ' 个活动';
  var sc = $('#sideCount'); if(sc) sc.textContent = CLOUD.docs.length ? CLOUD.docs.length + ' 个' : '';
}

/* ---------- 云端操作 ---------- */
function cloudCreate(name){
  var d = blankDoc(name || '未命名行程表');
  d.rows = [blankRow(1)];
  return api('/api/docs', { method:'POST', body:{ title:d.title, data:d } }).then(function(r){
    if(!r.ok){ toast('新建失败'); return; }
    return cloudRefresh().then(function(){ return cloudOpen(r.json.id).then(function(){ closeSide(); }); });
  });
}

function cloudCopyDoc(d){
  return api('/api/docs/' + d.id).then(function(g){
    if(!g.ok) return toast('读取失败');
    var data = g.json.data || {};
    data.title = (d.title || '未命名') + '（副本）';
    return api('/api/docs', { method:'POST', body:{ title:data.title, data:data } }).then(function(c){
      if(!c.ok) return toast('复制失败');
      return cloudRefresh().then(function(){ toast('已复制'); });
    });
  });
}

function cloudRename(d){
  modal('重命名活动', '<div class="field"><label>活动名称</label><input id="ri" value="' + esc(d.title || '') + '"></div>', function(){
    var t = ($('#ri').value || '').trim();
    if(!t) return;
    api('/api/docs/' + d.id).then(function(g){
      if(!g.ok) return toast('读取失败');
      var data = g.json.data || {};
      data.title = t;
      return api('/api/docs/' + d.id, { method:'PUT', body:{ title:t, data:data, version:g.json.version } }).then(function(r){
        if(r.ok){ toast('已改名'); cloudRefresh(); if(d.id === CLOUD.docId){ doc.title = t; paint(); } }
        else if(r.status === 409) toast('别人刚改过，请刷新后再试');
        else toast('改名失败');
      });
    });
  });
}

function cloudDeleteDoc(d){
  askConfirm('删除这份表？', '「' + esc(d.title || '') + '」会从云端删除，同事也将看不到。', function(){
    api('/api/docs/' + d.id, { method:'DELETE' }).then(function(r){
      if(!r.ok) return toast(r.json.message || '删除失败');
      var wasCur = d.id === CLOUD.docId;
      CLOUD.docs = CLOUD.docs.filter(function(x){ return x.id !== d.id; });
      toast('已删除');
      if(wasCur){
        CLOUD.docId = null; CLOUD.version = 0;
        if(CLOUD.docs.length) cloudOpen(CLOUD.docs[0].id);
        else cloudCreate(doc.title || '新活动');
      }
      renderCloudSide();
    });
  }, true);
}

function cloudInvite(){
  if(!CLOUD.docId) return toast('先打开一份表');
  api('/api/docs/' + CLOUD.docId + '/invite', { method:'POST', body:{} }).then(function(r){
    if(!r.ok) return toast(r.json.message || '生成邀请失败');
    var url = location.origin + location.pathname + '?join=' + r.json.code;
    var exp = new Date(r.json.expires_at).toLocaleString('zh-CN');
    modal('邀请同事协作',
      '<div class="dlg">把这条链接发给他，用邮箱登录后就能一起编辑这份表。' +
      '<br>有效期到 ' + esc(exp) + '。</div>' +
      '<div class="field" style="margin-top:12px"><textarea id="invUrl" rows="3" readonly>' + esc(url) + '</textarea></div>',
      function(){
        var t = document.getElementById('invUrl');
        if(t){ t.select(); try{ document.execCommand('copy'); }catch(e){} }
        toast('链接已复制');
      }, { okText:'复制链接' });
  });
}

function cloudAccount(){
  if(!CLOUD.user){ showLogin(); return; }
  modal('账号', '<div class="dlg">当前登录：<b>' + esc(CLOUD.user.email) + '</b><br>' +
    '数据保存在你自己的服务器上，换设备登录即可继续。</div>' +
    '<div style="margin-top:12px;font-size:12px;color:#8b98ac">这台设备的活动：' + CLOUD.docs.length + ' 个</div>',
    function(){ cloudLogout(false); }, { okText:'退出登录', cancelText:'关闭', danger:true });
}

/* ---------- 启动 ---------- */
function cloudBoot(){
  if(location.protocol === 'file:') return Promise.resolve();   // 本地文件打开：不探测后端，避免控制台报错
  return fetch('/api/health', { cache:'no-store' }).then(function(r){
    return r.ok ? r.json() : null;
  }).then(function(h){
    if(!h || !h.ok) return;              // 没有后端 → 本地模式
    CLOUD.on = true;
    CLOUD.canReg = !!h.register;
    try{ CLOUD.token = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){}

    var sv = document.querySelector('.save-wrap');
    if(sv && !document.getElementById('modeBadge')){
      var b = document.createElement('span');
      b.id = 'modeBadge'; b.className = 'modebadge';
      b.textContent = '本地';
      sv.appendChild(b);
    }

    if(!CLOUD.token){
      var localOnly = false;
      try{ localOnly = localStorage.getItem(LOCAL_KEY) === '1'; }catch(e){}
      if(!localOnly) showLogin();
      setBadge();
      return;
    }
    return api('/api/me').then(function(me){
      if(me.ok && me.json.user){
        CLOUD.user = me.json.user;
        setBadge();
        return cloudEnter();
      }
      CLOUD.token = '';
      showLogin();
      setBadge();
    });
  }).catch(function(){ /* 忽略：本地模式 */ });
}

function setBadge(){
  var sub = document.getElementById('sideSub');
  if(sub) sub.textContent = (CLOUD.on && CLOUD.user) ? ('已登录 · ' + CLOUD.user.email) : '本地存储 · 离线可用';
  var b = document.getElementById('modeBadge');
  if(!b) return;
  if(CLOUD.user){ b.textContent = '云端同步'; b.className = 'modebadge'; b.title = CLOUD.user.email; }
  else { b.textContent = '本地'; b.className = 'modebadge local'; b.title = '未登录，数据只在这台设备'; }
}

cloudBoot();

var fresh = !localStorage.getItem(LS);
load();
if(!doc.rows || !doc.rows.length) doc = seedDoc();
doc = normalizeDoc(doc);
paint();
try{ setDense(localStorage.getItem(LS + '.dense') === '1'); }catch(e){}
var savedView = 'table';
try{ savedView = localStorage.getItem(LS + '.view') || (window.innerWidth <= 980 ? 'card' : 'table'); }catch(e){}
setView(savedView);
renderAll();
if(fresh){ persist(); }
else setSave('已保存 ' + stamp(), false);
/* 首次：把现有表里的人名 / 地点收进常用库 */
if(!names.length){
  doc.rows.forEach(function(r){
    Object.keys(SUGGEST).forEach(function(k){
      var v = meaningful(r[k]);
      if(v) learnNames(v, SUGGEST[k]);
    });
  });
  persist();
}else{
  var nb = names.length;
  pruneNames();
  if(names.length !== nb) persist();
}
updateUndoBtns();

/* 页面隐藏 / 关闭前落盘 */
document.addEventListener('visibilitychange', function(){ if(document.hidden && dirty) persist('auto'); });
setInterval(function(){ try{ markNow(); }catch(e){} }, 60000);
tryLoadShare().catch(function(){});
window.addEventListener('beforeunload', function(){ if(dirty) persist(); });
})();
</script>
</body>
</html>
