<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>香港游学团行程安排 · 排期台账</title>
<style>
:root{
  --bg:#f2f4f8;
  --panel:#ffffff;
  --panel-2:#f8fafc;
  --ink:#101a29;
  --ink-2:#465468;
  --ink-3:#8b98ac;
  --line:#e2e8f0;
  --line-2:#eef2f7;
  --navy:#152747;
  --navy-2:#1d3560;
  --gold:#c39a3e;
  --gold-soft:#faf3e2;
  --accent:#2f6bff;
  --accent-2:#eaf0ff;
  --danger:#d9453a;
  --shadow-s:0 1px 2px rgba(16,26,41,.04);
  --shadow:0 1px 2px rgba(16,26,41,.05), 0 10px 30px rgba(16,26,41,.08);
  --shadow-l:0 20px 60px rgba(10,20,40,.18);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(47,107,255,.18)}

.app{display:block;min-height:100vh;position:relative}
.side{
  width:300px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;height:100dvh;z-index:130;
  transform:translateX(-100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
}
.side.open{transform:none;box-shadow:0 0 60px rgba(10,20,40,.2)}
.side-hd{padding:18px 16px 14px;border-bottom:1px solid var(--line-2);
  background:linear-gradient(160deg,#fbfcfe,#f4f7fc)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:14.5px;letter-spacing:.2px}
.brand .mark{
  width:32px;height:32px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(140deg,#152747 0%,#1d3560 55%,#2b4a80 100%);
  color:#d9b45c;display:grid;place-items:center;font-size:14px;font-weight:800;
  box-shadow:0 3px 10px rgba(21,39,71,.28);
}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-3);letter-spacing:.3px;margin-top:1px}
.side-actions{display:flex;gap:8px;margin-top:14px}
.side-actions .btn{flex:1;justify-content:center}
.side-sec{padding:14px 16px 2px;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:1px;display:flex;
  align-items:center;justify-content:space-between}
.side-sec span{font-weight:500;letter-spacing:0}
.side-tabs{display:flex;gap:5px;padding:10px 12px 2px}
.side-tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:12.5px;
  color:var(--ink-3);cursor:pointer;font-weight:650;transition:.15s;white-space:nowrap}
.side-tabs button:hover{background:var(--line-2);color:var(--ink-2)}
.side-tabs button.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(21,39,71,.22)}
.arch-list{flex:1;overflow:auto;padding:10px 10px 20px}
.arch{
  position:relative;border:1px solid var(--line);border-radius:12px;padding:11px 12px 9px;margin-bottom:8px;
  cursor:pointer;background:var(--panel);transition:border-color .16s,box-shadow .16s,transform .16s;overflow:hidden;
}
.arch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.16s}
.arch:hover{border-color:#c6d4ee;box-shadow:var(--shadow-s);transform:translateY(-1px)}
.arch.active{border-color:var(--accent);background:linear-gradient(180deg,#f7faff,#fff);box-shadow:0 2px 12px rgba(47,107,255,.12)}
.arch.active::before{background:linear-gradient(180deg,#2f6bff,#7aa2ff)}
.arch .t{font-weight:650;font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word}
.arch .m{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:7px;align-items:center}
.arch .dotg{width:5px;height:5px;border-radius:50%;background:#0f9d58;display:inline-block}
.arch .ops{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;opacity:.55;transition:opacity .15s}
.arch:hover .ops,.arch.active .ops{opacity:1}
.arch .ops .btn{padding:3px 7px;font-size:10.5px;border-radius:7px}
.arch .tagline{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.arch .tl{font-size:10px;padding:1px 7px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3)}
.arch .tl.gold{background:var(--gold-soft);border-color:#eddcb4;color:#8a6414;font-weight:650}
.hist .t{font-weight:600;font-size:12.5px}
.hist .m .auto{color:#0f9d58;font-weight:700}
.side-ft{padding:11px 14px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-3);
  display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel-2)}
.savedot{display:inline-flex;align-items:center;gap:6px}
.savedot i{width:6px;height:6px;border-radius:50%;background:#0f9d58;display:inline-block}
.savedot.busy i{background:var(--gold)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{position:sticky;top:0;z-index:40;background:rgba(242,244,248,.82);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.hero{
  padding:16px 20px 15px;display:flex;align-items:center;gap:16px;
  background:linear-gradient(135deg,#16294a 0%,#1d3560 48%,#22406f 100%);color:#fff;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(195,154,62,.22),transparent 68%);pointer-events:none}
.hero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,#c39a3e,rgba(195,154,62,.05) 62%,transparent)}
.hamb{display:inline-flex;position:absolute;left:14px;top:14px;z-index:3}
.hero-in{flex:1;min-width:0;position:relative;z-index:1;padding-left:46px;padding-right:46px}
.t-edit{
  width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:5px 10px;margin-left:-10px;
  color:#fff;font-size:19px;font-weight:700;text-align:center;
}
.t-edit:hover{background:rgba(255,255,255,.08)}
.t-edit:focus{outline:none;background:rgba(255,255,255,.12);box-shadow:0 0 0 2px rgba(195,154,62,.6)}
.t-edit::placeholder{color:rgba(255,255,255,.4)}
.s-edit{
  width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 10px;margin-left:-10px;
  color:rgba(255,255,255,.72);font-size:12.5px;text-align:center;
}
.s-edit:hover{background:rgba(255,255,255,.07)}
.s-edit:focus{outline:none;background:rgba(255,255,255,.1);color:#fff}
.hero-acts{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;align-items:flex-start}
.hero-acts>.hbtn,.hero-acts .menu-wrap>.hbtn{width:86px;height:38px;padding:0;justify-content:center}
.hbtn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);
  color:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;font-size:13px;transition:.16s;white-space:nowrap;font-weight:500;
  box-sizing:border-box;
}
.hbtn:hover{background:rgba(255,255,255,.19);border-color:rgba(255,255,255,.4)}
.hbtn.gold{background:linear-gradient(135deg,#d4ab4c,#b8862a);border-color:#c9a349;color:#2a1f06;font-weight:700;
  box-shadow:0 3px 12px rgba(195,154,62,.34)}
.hbtn.gold:hover{filter:brightness(1.07)}
.save-wrap{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.save-wrap>.hbtn{width:86px;height:38px;padding:0;justify-content:center}
.save-under{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10.5px;
  color:rgba(255,255,255,.62);white-space:nowrap;letter-spacing:.2px;transition:.2s}
.save-under i{width:5px;height:5px;border-radius:50%;background:#3ddc84;display:inline-block;flex:0 0 auto}
.save-under.saving{color:#e8c877}
.save-under.saving i{background:#e8c877;animation:pulse .8s infinite}

.stats{display:flex;gap:10px;padding:12px 20px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{
  flex:1 1 0;min-width:132px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 13px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow-s);
}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.stat .ic svg{display:block}
.stat .v{font-size:18px;font-weight:750;line-height:1.15}
.stat .k{font-size:11px;color:var(--ink-3);margin-top:1px}

.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink-2);transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#bfd0ee;color:var(--ink);background:#fbfcff;box-shadow:var(--shadow-s)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,#3a76ff,#2559d8);border-color:#2559d8;color:#fff;font-weight:600;
  box-shadow:0 2px 8px rgba(47,107,255,.28)}
.btn.pri:hover{filter:brightness(1.06);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger:hover{border-color:#f0b6b1;color:var(--danger);background:#fef6f5}
.btn.danger-solid{background:linear-gradient(135deg,#e2564a,#c93a2e);border-color:#c93a2e;color:#fff;font-weight:600}
.btn.danger-solid:hover{filter:brightness(1.06);color:#fff;border-color:#c93a2e}
.dlg{font-size:13.5px;line-height:1.85;color:var(--ink-2);margin:0}
.dlg b{color:var(--ink)}
.btn.icon{padding:8px 10px}
.menu-wrap{position:relative}
.menu{
  position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 20px 60px rgba(10,20,40,.22), 0 2px 8px rgba(10,20,40,.08);
  min-width:236px;padding:6px;display:none;z-index:900;
}
.menu.open{display:block;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;
  padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.menu button:hover{background:var(--accent-2);color:var(--accent)}
.menu-note{padding:7px 12px 9px 12px;font-size:11px;color:#93a0b3;border-top:1px solid var(--line-2);
  margin-top:4px;line-height:1.5}
.menu-note.warn{color:#b8791c;background:#fdf8ee}
.menu button .mi{width:19px;text-align:center;font-size:13px;line-height:1;flex:0 0 auto}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 2px}

.wrap{padding:16px 20px 30px;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);
  background:linear-gradient(180deg,#fbfcfe,#f6f8fc);flex-wrap:wrap}
.card-hd h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-hd h3::before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,#152747,#c39a3e)}
.pill{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--accent-2);color:var(--accent);font-weight:650;white-space:nowrap}
.pill.gray{background:var(--line-2);color:var(--ink-2)}
.pill.gold{background:var(--gold-soft);color:#8a6414;border:1px solid #eddcb4}
.pill.live{background:#fff3d6;color:#8a5c07;border:1px solid #efd9a3}
.pill.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#e0a32a;margin-right:5px;
  vertical-align:middle;animation:pulse 1.2s infinite}
.grow{flex:1}
.search{
  border:1px solid var(--line);border-radius:10px;padding:7px 11px;width:190px;background:#fff;color:var(--ink);
}
.search::placeholder{color:var(--ink-3)}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.seg{display:flex;background:var(--line-2);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:12px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:var(--shadow-s)}
.mob-only{display:none}
.savechip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);
  background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap;transition:.2s}
.savechip i{width:6px;height:6px;border-radius:50%;background:#0f9d58;display:inline-block;flex:0 0 auto}
.savechip.saving{color:#8a6414;background:var(--gold-soft);border-color:#eddcb4}
.savechip.saving i{background:var(--gold);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* 常用名字面板 */
.namepop{
  position:fixed;z-index:600;width:268px;max-width:calc(100vw - 24px);
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 18px 44px rgba(10,20,40,.2), 0 2px 8px rgba(10,20,40,.06);
  display:none;overflow:hidden;
}
.namepop.open{display:block;animation:pop .13s ease}
.namepop .np-hd{padding:8px 11px;font-size:11px;font-weight:700;color:var(--ink-2);
  background:linear-gradient(180deg,#fbfcfe,#f4f7fc);border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.namepop .np-hd span{font-weight:500;color:var(--ink-3);font-size:10px}
.namepop .np-list{max-height:236px;overflow:auto;padding:6px}
.np-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;transition:.12s}
.np-item:hover,.np-item.hot{background:var(--accent-2)}
.np-item .nm{font-size:13px;font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.np-item .mt{font-size:10px;color:var(--ink-3);white-space:nowrap}
.np-item .bar{width:34px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;flex:0 0 auto}
.np-item .bar i{display:block;height:100%;background:linear-gradient(90deg,#7aa2ff,var(--accent));border-radius:2px}
.np-empty{padding:14px 12px;font-size:12px;color:var(--ink-3);line-height:1.7;text-align:center}

/* 悬浮行工具条（WPS 风格） */
.rowtools{
  position:fixed;z-index:500;display:none;align-items:center;gap:1px;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 26px rgba(10,20,40,.16), 0 1px 3px rgba(10,20,40,.06);padding:3px;
}
.rowtools.open{display:flex}
.rowtools button{
  width:27px;height:27px;border:0;background:transparent;border-radius:7px;cursor:pointer;
  color:#5b6879;font-size:13px;display:grid;place-items:center;line-height:1;transition:.12s;
}
.rowtools button:hover{background:var(--accent-2);color:var(--accent)}
.rowtools button.del:hover{background:#fdeeec;color:var(--danger)}
.rowtools .sp{width:1px;height:15px;background:var(--line);margin:0 3px}
.coltools{min-width:0}
.coltools button{width:auto;padding:0 7px;font-size:11.5px;gap:3px;display:inline-flex}
.coltools button.del{color:#c2474f}
.coltools button.del:hover{background:#fdeeec;color:var(--danger)}
.hbtn[disabled]{opacity:.35;cursor:default;pointer-events:none}

/* 日期 / 时间 / 通用选择面板 */
.pickpop{
  position:fixed;z-index:600;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 20px 48px rgba(10,20,40,.2), 0 2px 8px rgba(10,20,40,.06);
  display:none;padding:12px;width:276px;
}
.pickpop.open{display:block;animation:pop .13s ease}
.pickpop .pp-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;
  font-size:13px;font-weight:700;color:var(--ink)}
.pickpop .pp-hd .nav{display:flex;gap:4px}
.pickpop .pp-hd .nav button{
  width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;
  color:var(--ink-2);font-size:12px;line-height:1;padding:0;
}
.pickpop .pp-hd .nav button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{font-size:10.5px;color:var(--ink-3);text-align:center;padding:3px 0 5px;font-weight:650}
.cal .d{height:30px;border-radius:7px;border:0;background:transparent;font-size:12.5px;cursor:pointer;
  color:var(--ink);font-variant-numeric:tabular-nums;padding:0}
.cal .d:hover{background:var(--accent-2);color:var(--accent)}
.cal .d.out{color:#ccd5e2}
.cal .d.sel{background:var(--navy);color:#fff;font-weight:700}
.cal .d.sel:hover{background:var(--navy);color:#fff}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.pp-ft{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.pp-ft .btn{flex:1;justify-content:center;padding:6px;font-size:12px;border-radius:8px}
.pp-lab{font-size:11px;color:var(--ink-3);font-weight:650;margin:2px 0 6px;letter-spacing:.3px}
.tm-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.tm-row label{font-size:11px;color:var(--ink-3);width:30px;flex:0 0 auto}
.tm-in{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:16px;text-align:center;
  font-variant-numeric:tabular-nums;outline:none;letter-spacing:1.5px;background:#fff;font-weight:650}
.tm-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip2{font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;
  cursor:pointer;color:var(--ink-2);transition:.12s}
.chip2:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-2)}

.scroll{overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1200px;font-size:13px;table-layout:fixed}
thead th{
  position:sticky;top:0;z-index:12;
  background:linear-gradient(180deg,#203761,#16294a);color:#fff;font-weight:650;font-size:12.5px;text-align:center;
  padding:11px 8px;border-right:1px solid rgba(255,255,255,.1);white-space:nowrap;
}
thead th:last-child{border-right:0}
thead th .th{
  display:block;outline:none;border-radius:6px;padding:3px 4px 3px 15px;cursor:text;min-height:18px;
  border:1px dashed transparent;transition:.14s;
}
thead th .th:hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
thead th .th:focus{background:#fff;color:var(--navy);border-color:var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.18)}
thead th .th:empty::after{content:'列名';color:rgba(255,255,255,.5)}
thead th .th:focus:empty::after{color:#b8c3d2}
tbody td{
  border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0;vertical-align:middle;
  background:var(--panel);transition:background .14s;
}
tbody tr:hover td{background:#f8fafd}
.cell{min-height:38px;padding:9px 10px;outline:none;white-space:pre-wrap;word-break:break-word;line-height:1.5;cursor:text}
.cell:focus{background:#fff;box-shadow:inset 0 0 0 2px rgba(47,107,255,.5);border-radius:3px;position:relative;z-index:3}
.cell:empty::after{content:attr(data-ph);color:#cfd8e4;font-size:12px;opacity:0;transition:opacity .15s}
td:hover .cell:empty::after{opacity:1}
.cell:focus:empty::after{opacity:1;color:#8b98ac}

td.c-seq{background:var(--panel-2);text-align:center;position:sticky;left:0;z-index:6}
thead th:first-child{left:0;z-index:14}
.colgrip{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:14px;height:28px;
  display:grid;place-items:center;cursor:grab;opacity:0;color:rgba(255,255,255,.75);font-size:14px;
  line-height:1;border-radius:5px;background:rgba(255,255,255,.12);
  transition:opacity .12s,background .12s,color .12s;z-index:4;user-select:none;pointer-events:none}
thead th:hover .colgrip{opacity:1;pointer-events:auto}
.colgrip:hover{background:rgba(255,255,255,.32);color:#fff}
.colgrip:active{cursor:grabbing}
body.col-dragging{cursor:grabbing}
body.col-dragging *{user-select:none !important}
th.drop-l{box-shadow:inset 3px 0 0 var(--gold)}
th.drop-r{box-shadow:inset -3px 0 0 var(--gold)}
tbody td.c-seq::after{content:"";position:absolute;top:0;right:0;bottom:0;width:1px;background:var(--line)}
td.c-seq:hover{background:#eef1f7}
.seqbadge{
  display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;margin:6px 0;border-radius:8px;
  background:var(--gc,#2f6bff);color:#fff;font-weight:700;font-size:12.5px;
}
td.c-date{background:#fbfcfe;text-align:center;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
td.c-date .cell{padding-left:4px;padding-right:4px}
td.c-phase{font-weight:650}
td.c-phase .cell{color:var(--gc,#16294a)}
td.c-time .cell{font-variant-numeric:tabular-nums;font-weight:650;color:#8a6414}
td.c-time.filled .cell{background:linear-gradient(90deg,#faf3e2,rgba(250,243,226,0))}
td.c-staff .cell,td.c-disp .cell{color:var(--ink-2);font-size:12.5px}
td.c-disp.filled .cell{background:linear-gradient(90deg,#eaf0ff,rgba(234,240,255,0))}
td.c-note .cell{color:#5b6879;font-size:12.5px}
td.c-mid .cell{font-size:12px;color:#8a6414}
tr.row-hl td{background:#fffaeb !important}
tr.now td{background:#fff8e4 !important}
tr.now td.c-seq{box-shadow:inset 3px 0 0 var(--gold)}
tr.now td.c-phase{position:relative}
tr.now td.c-phase::after{
  content:"进行中";position:absolute;right:7px;top:7px;z-index:2;
  font-size:9px;font-weight:700;line-height:1.5;color:#8a6414;background:#fdf0cf;
  border:1px solid #ecd8a4;border-radius:4px;padding:0 5px;letter-spacing:.3px;
  pointer-events:none;
}
tr.now td.c-phase .cell{padding-right:46px}
@media print{ tr.now td.c-phase::after{display:none} tr.now td.c-phase .cell{padding-right:7px} }
tr.addrow td{padding:0;border-bottom:0;background:var(--panel)}
tr.addrow button{width:100%;border:0;background:transparent;padding:11px;cursor:pointer;color:var(--ink-3);
  font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
tr.addrow button:hover{background:var(--accent-2);color:var(--accent)}
tr.grpfirst td{border-top:2px solid var(--gc,#2f6bff);opacity:1}
td.ops{white-space:nowrap;text-align:center;background:var(--panel-2);position:sticky;right:0;z-index:6;border-left:1px solid var(--line)}
td.ops .mini{display:inline-flex;gap:3px;padding:6px;opacity:.22;transition:.15s}
tr:hover td.ops .mini,td.ops:focus-within .mini{opacity:1}
.mbtn{border:1px solid var(--line);background:#fff;border-radius:7px;width:25px;height:25px;line-height:1;cursor:pointer;
  color:var(--ink-3);font-size:12px;padding:0;transition:.14s}
.mbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-2)}
.mbtn.del:hover{border-color:var(--danger);color:var(--danger);background:#fef6f5}
body.dense table{font-size:12.5px}
body.dense .cell{min-height:32px;padding:6px 8px}

.foot-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.foot-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.foot-box h4{margin:0;padding:11px 14px;font-size:13.5px;display:flex;align-items:center;gap:8px;font-weight:700;
  border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#fbfcfe,#f6f8fc)}
.foot-box h4 .n{width:20px;height:20px;border-radius:6px;background:#152747;color:#d9b45c;display:grid;place-items:center;
  font-size:11px;font-weight:800}
.foot-box textarea{width:100%;border:0;outline:none;resize:vertical;min-height:126px;padding:12px 14px;line-height:1.85;
  background:transparent;font-size:13px;color:var(--ink-2);display:block}
.foot-box textarea:focus{background:#fcfdff}
.crew-edit{padding:2px 14px 10px;display:flex;flex-wrap:wrap;gap:6px;min-height:36px;align-content:flex-start}
.crew-edit .chip{display:inline-flex;align-items:center;gap:4px;padding-right:4px}
.crew-edit .chip .x{
  width:15px;height:15px;border-radius:50%;border:0;background:transparent;color:#9aa8bd;
  cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;padding:0;
}
.crew-edit .chip .x:hover{background:#fdeeec;color:var(--danger)}
.crew-add{padding:0 14px 12px}
.crew-add input{
  width:100%;border:1px dashed var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;
  background:#fbfcfe;outline:none;transition:.15s;color:var(--ink);
}
.crew-add input:focus{border-style:solid;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-2)}
.crew-add input::placeholder{color:#b8c3d2}
.chip{font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.count-note{font-size:11px;color:var(--ink-3);padding:0 14px 12px}
.count-note:empty{display:none}

.mview{display:none;padding:12px;gap:11px}
.gcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.gcard.now-g{border-color:#efd9a3;box-shadow:0 0 0 2px #fdf0cf, 0 10px 26px rgba(195,154,62,.14)}
.gcard.now-g .ghd{background:linear-gradient(135deg,#fdf6e6,#fffaf0)}
.ghd{display:flex;gap:10px;align-items:center;padding:12px 13px;background:var(--panel-2);border-bottom:1px solid var(--line-2);
  border-left:4px solid var(--gc,#2f6bff)}
.gseq{width:28px;height:28px;border-radius:9px;background:var(--gc,#2f6bff);color:#fff;display:grid;place-items:center;
  font-weight:750;font-size:13px;flex:0 0 auto}
.ghd .g1{font-weight:700;font-size:14.5px;color:var(--gc,#16294a)}
.ghd .g1.empty{color:var(--ink-3);font-weight:600}
.ghd .g2{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.gbody{padding:4px 13px 10px}
.trow{padding:11px 0;border-bottom:1px dashed var(--line-2)}
.trow:last-child{border-bottom:0}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.tag{font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;color:var(--ink-2)}
.tag.t{background:#faf3e2;border-color:#eddcb4;color:#8a6414;font-weight:650;font-variant-numeric:tabular-nums}
.tag.p{background:#eaf0ff;border-color:#cddcff;color:var(--accent)}
.fld{margin-top:7px}
.fld .k{font-size:10px;color:var(--ink-3);letter-spacing:.8px;margin-bottom:2px;font-weight:600}
.fld .v{font-size:13.5px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.fld.n .v{color:#5b6879;font-size:13px}
.mops{display:flex;gap:7px;padding:9px 13px;border-top:1px solid var(--line-2);background:var(--panel-2);flex-wrap:wrap}

.mask{position:fixed;inset:0;background:rgba(11,18,32,.46);display:none;place-items:center;z-index:200;padding:20px}
.mask.open{display:grid;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(8,16,32,.3);width:min(580px,100%);max-height:86vh;overflow:auto;
  animation:rise .2s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{margin:0;padding:17px 20px;border-bottom:1px solid var(--line-2);font-size:15.5px;font-weight:700;
  display:flex;align-items:center;gap:8px}
.modal .bd{padding:18px 20px}
.modal .ft{padding:13px 20px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end;background:var(--panel-2)}
.modal.wide{width:min(1240px,96vw)}
.modal.wide .bd{padding:0}
.prevbar{display:flex;align-items:center;gap:8px;padding:11px 18px;border-bottom:1px solid var(--line-2);
  background:var(--panel-2);font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.prevscroll{max-height:64vh;overflow:auto;background:#fff}
.prevscroll table{min-width:0;width:100%;font-size:12px;table-layout:auto}
.prevscroll thead th{padding:9px 7px;font-size:11.5px;white-space:normal}
.prevscroll .cell{min-height:0;padding:7px 8px;cursor:default}
.prevscroll .cell:focus{box-shadow:none;background:transparent}
.prevscroll tbody tr:hover td{background:var(--panel)}
.dl-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.dl-opt .thumb{height:132px}
.dl-opt{border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.18s;background:#fff;text-align:left}
.dl-opt:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(47,107,255,.14);transform:translateY(-2px)}
.dl-opt .thumb{border-radius:9px;background:linear-gradient(160deg,#eef3ff,#f8fafd);border:1px solid var(--line-2);
  display:grid;place-items:center;margin-bottom:12px;color:#9aa8bd;font-size:11px;font-weight:600;letter-spacing:1px;
  height:148px;line-height:1.7;text-align:center}
.dl-opt.land .thumb{width:100%}
.dl-opt.port .thumb{width:84px;margin-left:auto;margin-right:auto}
.dl-opt .n{font-weight:700;font-size:14px;margin-bottom:3px}
.dl-opt .d{font-size:12px;color:var(--ink-3);line-height:1.6}
@media (max-width:640px){
  .dl-opts{grid-template-columns:1fr}
  .dl-opt.port .thumb{max-width:100px}
  .modal.wide{width:96vw}
  .prevscroll{max-height:58vh}
}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px;font-weight:650}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.chk{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);background:#101a29;color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.24s;z-index:300;
  box-shadow:0 10px 30px rgba(0,0,0,.24)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(11,18,32,.4);z-index:120;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.print-only{display:none}
@media print{
  .print-only{display:block}
  .app{display:block !important}
  #printHead{margin-bottom:6mm}
  #printHead .pt{font-size:16pt;font-weight:800;text-align:center;color:#152747;letter-spacing:.5px}
  #printHead .ps{font-size:9pt;text-align:center;color:#6b7686;margin-top:2mm}
  #printHead .pf{margin-top:4mm;font-size:8.5pt;line-height:1.7;color:#333;border-top:.4mm solid #d8dee8;padding-top:2mm}
  #printHead .pf b{color:#152747}
}


/* ===== 视图切换 ===== */
.timebox{display:none;padding:16px 16px 24px}
body.tv-card .scroll{display:none}
body.tv-card .mview{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:12px;
  padding:14px;align-content:start;align-items:stretch}
body.tv-timeline .scroll{display:none}
body.tv-timeline .mview{display:none}
body.tv-timeline .timebox{display:block}

/* ===== 时间轴 ===== */
.tl-day{margin-bottom:20px}
.tl-dh{display:flex;align-items:center;gap:9px;margin:0 0 8px}
.tl-dh b{font-size:13px;color:var(--ink)}
.tl-dh span{font-size:11px;color:var(--ink-3)}
.tl-canvas{position:relative;padding-top:22px;--tlname:158px}
.tl-axis{position:absolute;left:calc(var(--tlname) + 10px);right:0;top:0;height:20px}
.tl-ax{position:absolute;top:2px;font-size:10px;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.tl-grid{position:absolute;left:calc(var(--tlname) + 10px);right:0;top:22px;bottom:0;pointer-events:none}
.tl-line{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.tl-row{position:relative;display:flex;align-items:center;gap:10px;height:32px;margin-bottom:4px;z-index:1}
.tl-name{width:var(--tlname);flex:0 0 auto;font-size:12px;color:var(--ink-2);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:2px;position:relative}
.tl-name.cont::after{content:"";position:absolute;right:6px;top:-4px;bottom:-4px;width:2px;background:var(--line-2);border-radius:2px}
.tl-track{position:relative;flex:1;height:28px}
.tl-bar{position:absolute;top:0;height:28px;min-width:8px;border-radius:8px;display:flex;align-items:center;padding:0 9px;
  font-size:11.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(10,20,40,.16);
  cursor:default;transition:transform .12s,box-shadow .12s}
.tl-bar:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(10,20,40,.22);z-index:3}
.tl-bar .lb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-bar em{flex:0 0 auto;font-style:normal;opacity:.85;margin-left:8px;font-variant-numeric:tabular-nums;font-size:10.5px}
.tl-out{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11.5px;font-weight:650;
  pointer-events:none;display:block;letter-spacing:.2px;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.tl-out em{font-style:normal;font-weight:400;color:#8b98ac;font-size:10.5px;font-variant-numeric:tabular-nums;margin-left:8px}
.tl-out.l{flex-direction:row-reverse}
.tl-tip{position:fixed;z-index:640;width:310px;max-width:calc(100vw - 22px);background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 52px rgba(10,20,40,.22);
  display:none;overflow:hidden}
.tl-tip.open{display:block;animation:pop .12s ease}
.tt-hd{padding:11px 14px;background:linear-gradient(135deg,#f7faff,#fff);border-bottom:1px solid var(--line-2)}
.tt-hd b{font-size:13.5px;color:var(--navy);display:block;line-height:1.45}
.tt-hd .sub{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tt-hd .tchip{background:var(--gold-soft);color:#8a6414;border-radius:5px;padding:1px 7px;font-weight:650;
  font-variant-numeric:tabular-nums}
.tt-body{padding:9px 14px 11px;max-height:44vh;overflow:auto}
.tt-row{display:flex;gap:9px;padding:3px 0;font-size:12.5px;line-height:1.65}
.tt-row .k{flex:0 0 72px;color:var(--ink-3);font-size:11.5px;padding-top:1px}
.tt-row .v{flex:1;color:var(--ink-2);word-break:break-word}
.tt-ft{padding:7px 12px;border-top:1px solid var(--line-2);background:#fbfcfe;display:flex;justify-content:flex-end}
.tt-ft button{border:0;background:transparent;color:var(--accent);font-size:12.5px;cursor:pointer;
  padding:4px 9px;border-radius:7px;font-weight:600}
.tt-ft button:hover{background:var(--accent-2)}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);z-index:2}
.tl-now::after{content:"现在";position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:#8a6414;background:var(--gold-soft);border:1px solid #eddcb4;border-radius:4px;padding:0 4px;
  white-space:nowrap;z-index:4}
@media (max-width:720px){ .tl-now::after{display:none} }
@media (max-width:980px){
  .tl-canvas{--tlname:82px}
  .tl-name{font-size:11px}
  .tl-bar{font-size:10.5px;padding:0 7px}
  .timebox{padding:12px 10px 20px}
}

/* ===== 桌面紧凑卡片 ===== */
.ccard{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:.15s;box-shadow:var(--shadow-s);display:flex;flex-direction:column}
.ccard:hover{border-color:#c6d4ee;box-shadow:0 12px 28px rgba(21,39,71,.13);transform:translateY(-1px)}
.ccard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc)}
.ccard.now-g{box-shadow:0 0 0 2px #fdf0cf, 0 10px 26px rgba(195,154,62,.14);border-color:#efd9a3}
.ccard.hit{box-shadow:0 0 0 2px #ffe6a0, 0 6px 18px rgba(195,154,62,.18);border-color:#f0dcae}
.cch{display:flex;gap:10px;padding:12px 13px 8px 18px;align-items:flex-start}
.ccn{width:26px;height:26px;border-radius:8px;background:var(--gc);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:700;flex:0 0 auto}
.cct{min-width:0;flex:1}
.cct b{display:block;font-size:13.5px;color:var(--ink);line-height:1.35;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cct span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccm{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 8px 18px;max-height:44px;overflow:hidden}
.ccm i{font-style:normal;font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
  padding:1px 7px;color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ccl{list-style:none;margin:0;padding:0 13px 10px 18px;display:flex;flex-direction:column;gap:3px}
.ccl li{font-size:11.5px;color:#4a5a70;line-height:1.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding-left:10px;position:relative}
.ccl li::before{content:"";position:absolute;left:0;top:8px;width:3px;height:3px;border-radius:50%;background:var(--gc)}
.ccl li.none,.ccl li.more{color:#b8c3d2}
.ccl li.more::before{background:#c8d2e0}
.ccf{margin-top:auto;padding:7px 13px 9px 18px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink-3);
  display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.ccf b{color:var(--ink-2);font-weight:600;overflow:hidden;text-overflow:ellipsis}


/* ===== 云端登录 ===== */
.cloudmask{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%, #1d3357 0%, #0d1729 55%, #0a1220 100%);padding:20px}
.cloudmask.open{display:flex}
.ccard{width:100%;max-width:388px;background:#fff;border-radius:20px;padding:30px 28px 22px;
  box-shadow:0 40px 90px rgba(0,0,0,.45)}
.ccard .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#22335a,#152747);
  color:#e8c877;display:grid;place-items:center;font-size:22px;font-weight:700;letter-spacing:1px;margin-bottom:16px}
.ccard h2{margin:0 0 6px;font-size:19px;color:#152747;font-weight:700;letter-spacing:.2px}
.ccard .sub{font-size:12.5px;color:#7b8798;line-height:1.7;margin-bottom:18px}
.ccard .field{margin-bottom:12px}
.ccard .field label{display:block;font-size:12px;color:#5b6879;margin-bottom:5px;font-weight:600}
.ccard .field input{width:100%;box-sizing:border-box;border:1px solid #dbe3ef;border-radius:10px;
  padding:11px 12px;font-size:14px;outline:none;transition:.15s;background:#fbfcfe;color:#16202e}
.ccard .field input:focus{border-color:#2f6bff;background:#fff;box-shadow:0 0 0 3px rgba(47,107,255,.1)}
.ccard .err{font-size:12px;color:#d4525e;min-height:17px;line-height:1.5;margin:2px 0 8px}
.ccard .submit{width:100%;height:44px;border:0;border-radius:11px;background:linear-gradient(135deg,#22335a,#152747);

(function(){
"use strict";

/* ================= 常量 ================= */
var GC = ['#3b6fe0','#0f9b8e','#d4842a','#8a5cd6','#d4527e','#4f8c3f','#0e8ba6','#b05a3c','#5a6acf','#a0801f'];
var COLS = [
  {k:'seq',  t:'序号',        w:50,  cls:'c-seq'},
  {k:'date', t:'日期',        w:96,  cls:'c-date'},
  {k:'phase',t:'环节',        w:112, cls:'c-phase'},
  {k:'time', t:'时间',        w:102, cls:'c-time'},
  {k:'place',t:'地点',        w:112, cls:'c-place'},
  {k:'disp', t:'调度负责人',  w:100, cls:'c-disp'},
  {k:'duty', t:'工作职责',    w:196, cls:'c-duty'},
  {k:'staff',t:'拆阳工作人员',w:112, cls:'c-staff'},
  {k:'note', t:'注意事项',    w:200, cls:'c-note'},
  {k:'mid',  t:'中阳负责伙伴',w:112, cls:'c-mid'}
];
var PH = {seq:'序号',date:'2026.10.21',phase:'填写环节名称',time:'09:00-10:00',place:'填写地点',
          disp:'填写负责人',duty:'填写工作职责',staff:'填写人员',note:'填写注意事项',mid:'填写伙伴'};
var LS = 'itinerary.table.v2';

/* ================= 数据模型 ================= */
function blankRow(g){ return {g:g||1,date:'',phase:'',time:'',place:'',disp:'',duty:'',staff:'',note:'',mid:''}; }
function defaultCols(){
  return COLS.map(function(c){ return {k:c.k, t:c.t, w:c.w, cls:c.cls, al:c.k==='seq'||c.k==='date'||c.k==='time'||c.k==='disp'?'center':'left'}; });
}
function blankDoc(name){
  return {id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          title:name||'未命名行程表', sub:'', rows:[blankRow(1)], rules:'', crew:'',
          cols:defaultCols(), updated:Date.now()};
}
/* 文档带上列定义（兼容老数据：headers → cols） */
function normalizeDoc(d){
  if(!d) return d;
  if(!d.cols || !d.cols.length){
    var base = defaultCols();
    if(d.headers){
      base.forEach(function(c){ if(norm(d.headers[c.k])) c.t = norm(d.headers[c.k]); });
    }
    d.cols = base;
  }
  delete d.headers;
  if(!d.colOrder) d.colOrder = [];
  if(!d.hideCols) d.hideCols = [];
  return d;
}
function getCols(model){
  model = model || doc;
  return (model.cols && model.cols.length) ? model.cols : defaultCols();
}
function colDef(model, k){
  var cs = getCols(model);
  for(var i = 0; i < cs.length; i++){ if(cs[i].k === k) return cs[i]; }
  return null;
}
function hdrOf(model, k){
  var c = colDef(model, k);
  return c ? (norm(c.t) || k) : k;
}
function phOf(k){
  return PH[k] || '填写内容';
}
/* 可见列（支持列排序与隐藏） */
function fullOrder(){
  var all = getCols(doc).map(function(c){ return c.k; });
  var order = (doc.colOrder && doc.colOrder.length) ? doc.colOrder.slice() : all.slice();
  all.forEach(function(k){ if(order.indexOf(k) < 0) order.push(k); });
  return order;
}
function visibleCols(model){
  model = model || doc;
  var cs = getCols(model);
  var all = cs.map(function(c){ return c.k; });
  var order = (model.colOrder && model.colOrder.length) ? model.colOrder.slice() : all.slice();
  all.forEach(function(k){ if(order.indexOf(k) < 0) order.push(k); });
  var hide = model.hideCols || [];
  var out = [];
  order.forEach(function(k){
    if(k !== 'seq' && hide.indexOf(k) >= 0) return;
    for(var i = 0; i < cs.length; i++){ if(cs[i].k === k){ out.push(cs[i]); break; } }
  });
  return out.length ? out : [cs[0]];
}

/* ================= 正式数据（逐格录入原表） ================= */
function seedDoc(){

    R(1,{date:'2026.10.19',phase:'抵达 · 会务准备',time:'15:00-22:00',place:'ICC',disp:'/',
         duty:'协助会务现场，检查场地设施，发卡',staff:'/',note:'配合保险团队'}),
    /* ---- 2 ---- */
    R(2,{date:'2026.10.20',phase:'客户开户',time:'11:00-18:00',place:'太子酒店',disp:'小舒',duty:'开户',
         staff:'雯雯/水晶/聪聪/小鱼/毛毛',note:'配合保险团队'}),
    /* ---- 3 从太子接侍客户到ICC ---- */
    R(3,{date:'2026.10.21',phase:'从太子接侍客户到ICC',time:'08:50-09:00',place:'太子酒店',disp:'黄国哗',
         duty:'帮客户绑定行李标签，送客户上车',staff:'黄国哗',note:'帮忙拿行李，上车'}),
    R(3,{duty:'送客户上大巴车，随同客户到ICC',note:'带客户下3楼大堂带至68楼'}),
    R(3,{time:'09:10-09:30',place:'ICC 8楼大堂外',disp:'Ruby',
         duty:'把行李从车上拿下来',staff:'廖迁/小俞/泓翔/小舒',
         note:'门口站定迎接客户，拿取安静有序，确认所有行李均交由对应客户，无遗漏'}),
    R(3,{place:'ICC 3楼大堂电梯口',duty:'发电梯门禁卡',staff:'linda/suki',
         note:'门口站定迎接客户，客户下车时候每一位下车客户，确保一客一卡'}),
    R(3,{place:'ICC 8楼大堂扶梯口',duty:'指引客户上48楼电梯',staff:'/',
         note:'热情服务，面带微笑，对路线熟悉'}),
    R(3,{place:'ICC48楼刷卡进入口',duty:'指引客户上68楼电梯',staff:'/'}),
    R(3,{place:'ICC会场门口',duty:'迎接客户',staff:'嘉嘉'}),
    R(3,{duty:'',staff:'刘老师',note:'/'}),

var doc = seedDoc();

var names = [];        // 常用库：[{n,c,t,cat:'name'|'place'}]
var curId = null;
var dirty = false, saveTimer = null, touched = false, lastBackup = 0;
var undoStack = [], redoStack = [], MAX_UNDO = 80;
var skipUndo = false;

function load(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return;
    var s = JSON.parse(raw);
    archive = Array.isArray(s.archive) ? s.archive : [];
    names = Array.isArray(s.names) ? s.names : [];
    names.forEach(function(x){ if(!x.cat) x.cat = 'name'; });
    archive.forEach(function(a){ if(a.doc) normalizeDoc(a.doc); });
    if(s.doc && s.doc.rows) doc = normalizeDoc(s.doc);
    curId = s.curId || null;
    lastBackup = s.lastBackup || 0;
  }catch(e){}
}
function setSave(t, busy){
  var n = document.getElementById('saveState');
  n.innerHTML = '<i></i>' + t;
  n.className = 'savedot' + (busy ? ' busy' : '');
  var chip = document.getElementById('saveUnder');
  if(chip){
    chip.className = 'save-under' + (busy ? ' saving' : '');
    chip.innerHTML = '<i></i>' + (busy ? '自动保存中…' : t.replace('已保存 ', '已自动保存 '));
  }
}
function stamp(){
  return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
function persist(){
  doc.updated = Date.now();
  try{
    localStorage.setItem(LS, JSON.stringify({doc:doc, archive:archive, names:names, curId:curId, lastBackup:lastBackup}));
    setSave('已保存 ' + stamp(), false);
  }catch(e){
    try{
      // 存储超限：先把最旧的存档快照瘦身
      archive.forEach(function(a){ if(a.id !== curId) a.doc = null; });
      localStorage.setItem(LS, JSON.stringify({doc:doc, archive:archive, names:names, curId:curId, lastBackup:lastBackup}));
      setSave('已保存（空间紧张）', false);
    }catch(e2){ setSave('保存失败：存储已满', true); }
  }
  if(typeof cloudQueueSave === 'function') cloudQueueSave();
}
function autosave(){
  dirty = true; touched = true; setSave('自动保存中…', true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    persist();
    dirty = false;
    renderSide();
  }, 700);
}

/* ================= 撤销 / 重做 ================= */
function cloneState(){
  return JSON.stringify({
    rows: doc.rows, cols: doc.cols || [], title: doc.title, sub: doc.sub,
    rules: doc.rules || '', crew: doc.crew || '',
    colOrder: doc.colOrder || [], hideCols: doc.hideCols || []
  });
}
var lastPushed = '';
function pushUndo(){
  if(skipUndo){ skipUndo = false; return; }
  var s = cloneState();
  if(s === lastPushed) return;
  if(undoStack.length && undoStack[undoStack.length-1] === s){ lastPushed = s; return; }
  undoStack.push(s);
  if(undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
  lastPushed = s;
  updateUndoBtns();
}
function applyState(str){
  var o = JSON.parse(str);
  doc.rows = o.rows || [];
  doc.cols = o.cols || defaultCols();
  doc.title = o.title || '';
  doc.sub = o.sub || '';
  doc.rules = o.rules || '';
  doc.crew = o.crew || '';
  doc.colOrder = o.colOrder || [];
  doc.hideCols = o.hideCols || [];
  paint(); renderAll(); autosave();
}
function undo(){
  if(!undoStack.length){ toast('没有可撤销的操作'); return; }
  redoStack.push(cloneState());
  applyState(undoStack.pop());
  lastPushed = cloneState();
  updateUndoBtns();
  toast('已撤销');
}
function redo(){
  if(!redoStack.length){ toast('没有可重做的操作'); return; }
  undoStack.push(cloneState());
  applyState(redoStack.pop());
  lastPushed = cloneState();
  updateUndoBtns();
  toast('已重做');
}
function updateUndoBtns(){
  var u = $('#btnUndo'), r = $('#btnRedo');
  if(u) u.disabled = !undoStack.length;
  if(r) r.disabled = !redoStack.length;
}
function crewList(){
  return norm(doc.crew).split(/[、,，\/\s]+/)
    .map(function(s){ return s.replace(/[。.]+$/, '').trim(); })
    .filter(Boolean);
}
function renumber(){
  var map = {}, n = 1;
  doc.rows.forEach(function(r){ var g = r.g || 1; if(!(g in map)) map[g] = n++; r.g = map[g]; });
}
function groupCount(){ var s = {}; doc.rows.forEach(function(r){ s[r.g||1] = 1; }); return Object.keys(s).length; }
function dateList(){ var o = []; doc.rows.forEach(function(r){ var v = norm(r.date); if(v && o.indexOf(v) < 0) o.push(v); }); return o; }

/* scope: 'group' 仅同环节内合并；'all' 跨环节合并（日期/环节） */
function spans(rows, key, scope){
  var res = new Array(rows.length).fill(0), i = 0;
  while(i < rows.length){
    var j = i + 1;
    while(j < rows.length
      && norm(rows[j][key]) === norm(rows[i][key])
      && (scope !== 'group' || (rows[j].g||1) === (rows[i].g||1))) j++;
    res[i] = j - i; i = j;
  }
  return res;
}
function seqSpans(rows){
  var res = new Array(rows.length).fill(0), i = 0;
  while(i < rows.length){ var j = i+1; while(j < rows.length && (rows[j].g||1) === (rows[i].g||1)) j++; res[i] = j-i; i = j; }
  return res;
}
function buildSpans(model){
  var rows = model.rows, sp = {}, sq = seqSpans(rows);
  getCols(model).forEach(function(c){
    sp[c.k] = (c.k === 'seq') ? sq
            : ((c.k === 'date' || c.k === 'phase') ? spans(rows, c.k, 'all')
            : spans(rows, c.k, 'group'));
  });
  return sp;
}

/* ================= 表格 HTML（可复用于预览） ================= */
function tableHTML(model, opts){
  opts = opts || {};
  var ro = !!opts.readonly;
  var kw = opts.kw || '';
  var rows = model.rows || [];
  var cols = visibleCols(model);
  var h = '<table><thead><tr>';
  cols.forEach(function(c){
    if(ro){
      h += '<th style="width:'+c.w+'px">' + esc(hdrOf(model, c.k)) + '</th>';
    }else{
      h += '<th style="width:'+c.w+'px" data-hk="'+c.k+'">'
         + (c.k === 'seq' ? '' : '<span class="colgrip" title="拖动调整列顺序">⠿</span>')
         + '<span class="th" contenteditable="true" spellcheck="false" data-hk="'+c.k+'">'
         + esc(hdrOf(model, c.k)) + '</span></th>';
    }
  });
  h += '</tr></thead><tbody>';

  if(!rows.length){
    h += '<tr><td colspan="'+cols.length+'"><div class="empty">还没有内容</div></td></tr>';
    return h + '</tbody></table>';
  }
  var sp = buildSpans(model);
  rows.forEach(function(r, i){
    var gc = gcolor(r.g||1);
    var hit = kw && Object.keys(r).some(function(k){ return norm(r[k]).toLowerCase().indexOf(kw) >= 0; });
    var first = i > 0 && (rows[i-1].g||1) !== (r.g||1);
    h += '<tr class="' + (hit ? 'row-hl ' : '') + (first ? 'grpfirst' : '') + '" data-i="'+i+'" style="--gc:'+gc+'">';
    cols.forEach(function(c){
      var n = sp[c.k][i];
      if(!n) return;
      var inner;
      if(c.k === 'seq'){
        inner = '<span class="seqbadge" style="--gc:'+gc+'">'+(r.g||1)+'</span>';
      }else if(ro){
        inner = '<div class="cell">'+esc(r[c.k])+'</div>';
      }else{
        inner = '<div class="cell" contenteditable="true" spellcheck="false" data-i="'+i+'" data-k="'+c.k+
                '" data-span="'+n+'" data-ph="'+esc(phOf(c.k))+'">'+esc(r[c.k])+'</div>';
      }
      h += '<td class="'+(c.cls||'')+(norm(r[c.k])?' filled':'')+'"'+(n>1?' rowspan="'+n+'"':'')+
           (c.k==='seq' ? ' title="拖动移动这一行；按住 ⌥ 拖动移动整个环节；单击选中"' : ' data-k="'+c.k+'"')+
           '>'+inner+'</td>';
    });
    h += '</tr>';
  });
  if(!ro){
    h += '<tr class="addrow"><td colspan="'+cols.length+'">'+
         '<button type="button" data-act="addend">＋ 添加一行</button></td></tr>';
  }
  return h + '</tbody></table>';
}

/* ================= 拖拽调整列顺序 ================= */
var colDrag = null;
function onGripDown(e){
  var g = e.target.closest ? e.target.closest('.colgrip') : null;
  if(!g) return;
  var th = g.closest('th');
  if(!th || !th.dataset.hk) return;
  e.preventDefault(); e.stopPropagation();
  colDrag = {k:th.dataset.hk, x:e.clientX, moved:false, target:null, th:th};
  th.classList.add('col-src');
  document.addEventListener('mousemove', onColMove);
  document.addEventListener('mouseup', onColUp, {once:true});
}
function onColMove(e){
  if(!colDrag) return;
  if(!colDrag.moved && Math.abs(e.clientX - colDrag.x) < 4) return;
  colDrag.moved = true;
  document.body.classList.add('col-dragging');
  var ths = Array.prototype.slice.call(document.querySelectorAll('#timeBox, #tableBox'))
    .length ? Array.prototype.slice.call(document.querySelectorAll('#tableBox thead th[data-hk]')) : [];
  var best = null, bd = 1e9;
  ths.forEach(function(th){
    var r = th.getBoundingClientRect();
    if(!r.width) return;
    var mid = r.left + r.width / 2;
    var d = Math.abs(e.clientX - mid);
    if(d < bd){ bd = d; best = {th:th, side: e.clientX < mid ? 'left' : 'right'}; }
  });
  ths.forEach(function(th){ th.classList.remove('drop-l', 'drop-r'); });
  if(best && best.th.dataset.hk !== colDrag.k){
    best.th.classList.add(best.side === 'left' ? 'drop-l' : 'drop-r');
    colDrag.target = best;
  }else{
    colDrag.target = null;
  }
}
function onColUp(){
  document.removeEventListener('mousemove', onColMove);
  document.body.classList.remove('col-dragging');
  document.querySelectorAll('#tableBox thead th').forEach(function(th){ th.classList.remove('drop-l', 'drop-r', 'col-src'); });
  var st = colDrag; colDrag = null;
  if(!st || !st.moved || !st.target) return;
  var order = fullOrder();
  var from = order.indexOf(st.k);
  var to = order.indexOf(st.target.th.dataset.hk);
  if(from < 0 || to < 0 || from === to) return;
  var at = st.target.side === 'left' ? to : to + 1;
  pushUndo();
  order.splice(from, 1);
  if(at > from) at--;
  order.splice(at, 0, st.k);
  doc.colOrder = order;
  autosave(); renderTable();
  toast('已移动「' + hdrOf(doc, st.k) + '」列');
}

/* ================= 当前环节 ================= */
function timeRange(str){
  var m = String(str || '').match(/(\d{1,2})[:：](\d{2})\s*[-~—－至]\s*(\d{1,2})[:：](\d{2})/);
  if(!m) return null;
  return {s: (+m[1]) * 60 + (+m[2]), e: (+m[3]) * 60 + (+m[4])};
}
function nowInfo(){
  var t = new Date();
  var today = t.getFullYear() + '.' + pad2(t.getMonth() + 1) + '.' + pad2(t.getDate());
  var mins = t.getHours() * 60 + t.getMinutes();
  var active = -1, next = -1, nextStart = 1e9;
  doc.rows.forEach(function(r, i){
    var d = norm(r.date);
    if(d && d !== today) return;
    var rg = timeRange(r.time);
    if(!rg) return;
    if(mins >= rg.s && mins <= rg.e && active < 0) active = i;
    if(rg.s > mins && rg.s < nextStart){ nextStart = rg.s; next = i; }
  });
  return {active:active, next:next};
}
function markNow(){
  var info = nowInfo();
  document.querySelectorAll('#tableBox tbody tr[data-i]').forEach(function(tr){ tr.classList.remove('now'); });
  document.querySelectorAll('#cardBox .gcard').forEach(function(c){ c.classList.remove('now-g'); });
  var chip = $('#nowChip');
  if(info.active >= 0){
    var tr = document.querySelector('#tableBox tbody tr[data-i="' + info.active + '"]');
    if(tr) tr.classList.add('now');
    var g = doc.rows[info.active].g || 1;
    var card = document.querySelectorAll('#cardBox .gcard')[g - 1];
    if(card) card.classList.add('now-g');

function renderCompactCards(){
  var box = $('#cardBox');

  if(!doc.rows.length){
    box.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有内容，点上方「＋ 环节」开始搭建</div>';
    return;
  }
  var groups = [];
  doc.rows.forEach(function(r, i){
    var g = r.g || 1, last = groups[groups.length - 1];
    if(!last || last.g !== g) groups.push({g:g, items:[]});
    groups[groups.length - 1].items.push({r:r, i:i});
  });
  var nowG = -1;
  try{ var ni = nowInfo(); if(ni.active >= 0) nowG = doc.rows[ni.active].g || 1; }catch(e){}

  var h = '';
  groups.forEach(function(G){
    var f = G.items[0].r, gc = gcolor(G.g);
    var ds = [], times = [], places = [], disps = [], duties = [], people = [];
    var hit = false;
    G.items.forEach(function(x){
      var r = x.r;
      var d = norm(r.date); if(d && ds.indexOf(d) < 0) ds.push(d);
      var t = meaningful(r.time); if(t && times.indexOf(t) < 0) times.push(t);
      var pl = meaningful(r.place); if(pl && places.indexOf(pl) < 0) places.push(pl);
      var dp = meaningful(r.disp); if(dp && disps.indexOf(dp) < 0) disps.push(dp);
      var du = meaningful(r.duty); if(du && duties.indexOf(du) < 0) duties.push(du);
      (norm(r.staff) + '/' + norm(r.mid)).split(/[\/、,，+]+/).forEach(function(n){
        n = n.replace(/[。.]/g, '').replace(/\d+$/, '').trim();
        if(n && n !== '—' && n !== '/' && people.indexOf(n) < 0) people.push(n);
      });
      if(kw && Object.keys(r).some(function(k){ return norm(r[k]).toLowerCase().indexOf(kw) >= 0; })) hit = true;
    });
    var title = meaningful(f.phase) || duties[0] || '未命名环节';
    var sub = [times.join(' / '), ds.join(' · ')].filter(Boolean).join('　');
    var meta = [];
    if(places.length) meta.push(places[0]);
    if(disps.length) meta.push('调度 ' + disps[0]);
    if(G.items.length > 1) meta.push(G.items.length + ' 项');

    h += '<div class="ccard' + (G.g === nowG ? ' now-g' : '') + (hit ? ' hit' : '') + '" style="--gc:' + gc +
         '" data-i="' + G.items[0].i + '" title="点击在表格中查看这一环节">' +
      '<div class="cch"><div class="ccn">' + G.g + '</div>' +
        '<div class="cct"><b>' + esc(title) + '</b><span>' + esc(sub || '未填日期') + '</span></div></div>' +
      (meta.length ? '<div class="ccm">' + meta.map(function(m){ return '<i>' + esc(m) + '</i>'; }).join('') + '</div>' : '') +
      '<ul class="ccl">' +
        (duties.length ? duties.slice(0, 3).map(function(d){ return '<li>' + esc(d) + '</li>'; }).join('')
                       : '<li class="none">未填工作职责</li>') +
        (duties.length > 3 ? '<li class="more">… 另有 ' + (duties.length - 3) + ' 项</li>' : '') +
      '</ul>' +
      '<div class="ccf">' + (people.length
        ? '<b>' + people.length + ' 人</b>' + esc(people.slice(0, 4).join('、')) + (people.length > 4 ? ' 等' : '')
        : '未填参与人员') + '</div>' +
    '</div>';
  });
  box.innerHTML = h;
}

/* ================= 操作 ================= */
/* 切换活动前，把当前表存进存档，避免覆盖丢失 */
function stashCurrent(){
  if(!touched) { touched = false; return; }
  var hasContent = (doc.rows || []).some(function(r){
    return meaningful(r.phase) || meaningful(r.duty) || meaningful(r.place) || meaningful(r.time);
  });
  if(!hasContent){ touched = false; return; }
  if(curId){
    var a = archive.filter(function(x){ return x.id === curId; })[0];
    if(a){ a.doc = clone(doc); a.title = doc.title || a.title; a.updated = Date.now(); }
    else archive.push({id:curId, title:doc.title || '未命名行程', updated:Date.now(), doc:clone(doc)});
  }else{
    archive.push({id:uid(), title:doc.title || '未命名行程', updated:Date.now(), doc:clone(doc)});
  }
  persist(); renderSide();
  toast('当前表已存入活动存档');
  touched = false;
}
function openArchive(id){
  undoStack = []; redoStack = []; lastPushed = ''; updateUndoBtns();
  var a = archive.filter(function(x){ return x.id === id; })[0]; if(!a) return;
  if(dirty) persist();
  stashCurrent();
  doc = normalizeDoc(clone(a.doc)); curId = a.id; touched = false;
  paint(); renderAll(); persist(); closeSide(); toast('已打开：' + a.title);
}
function saveArchive(){
  var a = archive.filter(function(x){ return x.id === curId; })[0];
  if(a){ a.title = doc.title; a.updated = Date.now(); a.doc = clone(doc); }
  else{ curId = doc.id || (doc.id = uid()); archive.push({id:curId, title:doc.title, updated:Date.now(), doc:clone(doc)}); }
  persist('手动保存'); renderSide(); toast('已保存为活动存档');
}
/* 以某个活动为模板复制出一个新表，并直接切过去编辑 */
function copyArchive(id){
  undoStack = []; redoStack = []; lastPushed = ''; updateUndoBtns();
  var a = archive.filter(function(x){ return x.id === id; })[0]; if(!a) return;
  if(dirty) persist();
  var c = normalizeDoc(clone(a.doc));
  c.id = uid();
  c.title = (a.title || '未命名') + '（副本）';
  c.updated = Date.now();
  archive.push({id:c.id, title:c.title, updated:Date.now(), doc:clone(c)});
  doc = clone(c); curId = c.id;
  paint(); renderAll(); persist('复制'); renderSide(); closeSide();
  toast('已复制为「' + c.title + '」，可直接改');
}
function newDoc(name){
  undoStack = []; redoStack = []; lastPushed = ''; updateUndoBtns();
  if(dirty) persist();
  stashCurrent();
  var d = blankDoc(name); d.rows = [blankRow(1)];
  doc = d; curId = null; touched = false; paint(); renderAll(); persist(); renderSide(); closeSide(); toast('已新建空白表');
}
function dupDoc(){
  undoStack = []; redoStack = []; lastPushed = ''; updateUndoBtns();
  var c = clone(doc); c.id = uid(); c.title = doc.title + '（副本）'; c.updated = Date.now();
  doc = c; curId = null; paint(); renderAll(); persist(); renderSide(); toast('已复制为新表');
}
function insertRow(at, mode){
  pushUndo();
  renumber();
  var src = doc.rows[at], i = (mode === 'above') ? at : at+1;
  var r = blankRow(src ? (src.g||1) : 1);
  if(src){ ['date','phase','disp'].forEach(function(k){ r[k] = src[k]; }); }
  doc.rows.splice(i, 0, r); autosave(); renderAll();
  setTimeout(function(){
    var t = document.querySelector('.cell[data-i="'+i+'"][data-k="duty"]');
    if(t){ skipUndo = true; t.focus(); }
  }, 30);
}
function dupRow(at){ pushUndo(); renumber(); doc.rows.splice(at+1, 0, clone(doc.rows[at])); autosave(); renderAll(); }
function delRow(at){
  var g = doc.rows[at].g||1;
  var same = doc.rows.filter(function(r,i){ return i !== at && (r.g||1) === g; }).length;
  if(same === 0){
    askConfirm('删除整个环节？', '这是该环节的最后一行，删除后整个环节都会移除。', function(){ delGroup(g); }, true);
    return;
  }
  pushUndo();
  doc.rows.splice(at, 1); renumber(); autosave(); renderAll();
}
function delGroup(g){
  pushUndo();
  doc.rows = doc.rows.filter(function(r){ return (r.g||1) !== g; });
  renumber(); autosave(); renderAll(); toast('已删除环节');
}
function newGroup(){
  pushUndo();
  renumber();
  var last = doc.rows[doc.rows.length-1], max = 0;
  doc.rows.forEach(function(r){ max = Math.max(max, r.g||1); });
  var r = blankRow(max+1);
  if(last) r.date = last.date;
  doc.rows.push(r); autosave(); renderAll();
  setTimeout(function(){
    var t = document.querySelector('.cell[data-k="phase"][data-i="'+(doc.rows.length-1)+'"]');
    if(t){ skipUndo = true; t.focus(); }
  }, 30);
}

/* ================= 常用内容库（人名 / 地点） ================= */
var SUGGEST = {staff:'name', disp:'name', mid:'name', place:'place'};
var HALF_LIFE = 45;        // 45 天半衰期
var MAX_BANK = 260;

function nameScore(x){
  var days = Math.max(0, (Date.now() - (x.t || 0)) / 86400000);
  return (x.c || 1) * Math.pow(0.5, days / HALF_LIFE);
}
function extractItems(text, cat){
  var out = [];
  var sep = (cat === 'place') ? /[\/、,，;；]+/ : /[\/、,，;；+]+/;
  String(text == null ? '' : text).split(sep).forEach(function(s){
    var v = s.replace(/\u00a0/g, ' ').trim();
    if(!v || v === '/' || v === '—' || v === '-') return;
    if(cat !== 'place') v = v.replace(/\d+$/, '').replace(/^[（(].*?[)）]$/, '').trim();
    if(!v) return;
    if(v.length > (cat === 'place' ? 26 : 10)) return;
    if(!/[\u4e00-\u9fa5A-Za-z0-9]/.test(v)) return;
    if(out.indexOf(v) < 0) out.push(v);
  });
  return out;
}
function pruneNames(){
  names = names.filter(function(x){ return nameScore(x) >= 0.05; });
  if(names.length > MAX_BANK){
    names.sort(function(a,b){ return nameScore(b) - nameScore(a); });
    names = names.slice(0, MAX_BANK);
  }
}
function learnNames(text, cat){
  cat = cat || 'name';
  var list = extractItems(text, cat);
  if(!list.length) return;
  list.forEach(function(n){
    var e = null;
    for(var i = 0; i < names.length; i++){ if(names[i].n === n && (names[i].cat||'name') === cat){ e = names[i]; break; } }
    if(e){ e.c = (e.c || 1) + 1; e.t = Date.now(); }
    else names.push({n:n, c:1, t:Date.now(), cat:cat});
  });
  pruneNames();
}
function rankedNames(cat){
  cat = cat || 'name';
  return names.filter(function(x){ return (x.cat||'name') === cat; })
    .map(function(x){ return {n:x.n, c:x.c||1, t:x.t||0, s:nameScore(x)}; })
    .filter(function(x){ return x.s >= 0.08; })
    .sort(function(a,b){ return b.s - a.s || b.c - a.c; })
    .slice(0, 18);
}

/* ---- 常用内容面板 ---- */
var namePop = null, nameCell = null, nameCat = 'name';
function buildNamePop(){
  if(namePop) return namePop;
  namePop = document.createElement('div');
  namePop.className = 'namepop';
  namePop.innerHTML = '<div class="np-hd"><b id="npTitle">常用名字</b><span>越常用越靠前</span></div><div class="np-list"></div>';
  document.body.appendChild(namePop);
  namePop.addEventListener('mousedown', function(e){
    var it = e.target.closest('[data-name]');
    if(!it) return;
    e.preventDefault();
    if(nameCell) applyName(it.getAttribute('data-name'), nameCell);
    hideNamePop();
  });
  return namePop;
}
function showNamePop(cell){
  var cat = SUGGEST[cell.dataset.k];
  if(!cat) return;
  nameCat = cat;
  nameCell = cell;
  var list = rankedNames(cat);
  var pop = buildNamePop();
  pop.querySelector('#npTitle').textContent = cat === 'place' ? '常用地点' : '常用名字';
  pop.querySelector('.np-hd span').textContent = cat === 'place'
    ? '点一下直接填入' : '点一下填入，已有的会用 / 追加';
  var box = pop.querySelector('.np-list');
  if(!list.length){
    box.innerHTML = '<div class="np-empty">还没有记录。<br>在' + (cat === 'place' ? '地点' : '名字') +
                    '格里输入后会自动记住。</div>';
  }else{
    var mx = list[0].s || 1;
    box.innerHTML = list.map(function(x){
      var w = Math.max(8, Math.round(x.s / mx * 100));
      var days = Math.floor((Date.now() - x.t) / 86400000);
      var when = days <= 0 ? '今天' : (days === 1 ? '昨天' : days + ' 天前');
      return '<div class="np-item" data-name="'+esc(x.n)+'">'+
             '<span class="nm">'+esc(x.n)+'</span>'+
             '<span class="bar"><i style="width:'+w+'%"></i></span>'+
             '<span class="mt">'+x.c+'× · '+when+'</span></div>';
    }).join('');
  }
  hidePick();
  pop.classList.add('open');
  placePop(pop, cell);
}
function placePop(pop, cell){
  var r = cell.getBoundingClientRect();
  var pw = pop.offsetWidth, ph = pop.offsetHeight;
  var left = r.left, top = r.bottom + 6;
  if(top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}
function hideNamePop(){ if(namePop) namePop.classList.remove('open'); nameCell = null; }

function setCellText(cell, txt){
  cell.textContent = txt;
  cell.dispatchEvent(new Event('input', {bubbles:true}));
}
function applyName(name, cell){
  var cat = SUGGEST[cell.dataset.k] || 'name';
  var cur = cell.textContent.trim();
  if(cat === 'place'){
    setCellText(cell, name);
    learnNames(name, 'place');
    toast('已填入 ' + name);
    return;
  }
  var exists = extractItems(cur, 'name').indexOf(name) >= 0;
  if(!cur || cur === '/'){
    setCellText(cell, name);
  }else if(exists){
    toast('「' + name + '」已在格子里了');
    return;
  }else{
    setCellText(cell, cur.replace(/[\/、,，;；+]+$/,'') + '/' + name);
  }
  learnNames(name, 'name');
  toast('已填入 ' + name);
}

/* ================= 日期 / 时间选择器 ================= */
var pickPop = null, pickCell = null, calY = 0, calM = 0;
var WD = ['一','二','三','四','五','六','日'];

function ensurePick(){
  if(pickPop) return pickPop;
  pickPop = document.createElement('div');
  pickPop.className = 'pickpop';
  document.body.appendChild(pickPop);
  pickPop.addEventListener('mousedown', function(e){
    if(e.target.tagName === 'INPUT') return;
    e.preventDefault();
  });
  pickPop.addEventListener('click', function(e){
    var t = e.target.closest('[data-nav],[data-day],[data-act],[data-tm]');
    if(!t) return;
    if(t.hasAttribute('data-nav')){ calM += (+t.getAttribute('data-nav')); normCal(); renderDateCal(); return; }
    if(t.hasAttribute('data-day')){
      pushUndo();
      setCellText(pickCell, fmtDate(+t.getAttribute('data-y'), +t.getAttribute('data-m'), +t.getAttribute('data-day')));
      hidePick(); renderStats();
      return;
    }
    var act = t.getAttribute('data-act');
    if(act === 'today'){
      var n = new Date(); pushUndo();
      setCellText(pickCell, fmtDate(n.getFullYear(), n.getMonth(), n.getDate()));
      hidePick(); renderStats(); return;
    }
    if(act === 'clear'){ pushUndo(); setCellText(pickCell, ''); hidePick(); renderStats(); return; }
    if(act === 'apply'){
      var sv = (pickPop.querySelector('#tS') || {}).value || '';
      var ev2 = (pickPop.querySelector('#tE') || {}).value || '';
      sv = sv.trim(); ev2 = ev2.trim();
      if(!sv && !ev2){ return; }
      pushUndo();
      setCellText(pickCell, sv && ev2 ? (sv + '-' + ev2) : (sv || ev2));
      hidePick(); renderStats(); return;
    }
    if(t.hasAttribute('data-tm')){
      var parts = t.getAttribute('data-tm').split('-');
      var s1 = pickPop.querySelector('#tS'), e1 = pickPop.querySelector('#tE');
      if(s1) s1.value = parts[0] || '';
      if(e1) e1.value = parts[1] || '';
      if(parts.length === 1 && e1) e1.value = '';
      return;
    }
  });
  return pickPop;
}
function fmtDate(y,m,d){ return y + '.' + pad2(m+1) + '.' + pad2(d); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function normCal(){ while(calM < 0){ calM += 12; calY--; } while(calM > 11){ calM -= 12; calY++; } }
function parseDate(s){
  var m = String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return {y:+m[1], m:+m[2]-1, d:+m[3]};
  return null;
}
function openPick(cell){
  var pop = ensurePick();
  pop.classList.add('open');
  placePop(pop, cell);
}
function showDatePick(cell){
  hideNamePop();
  pickCell = cell;
  var cur = parseDate(cell.textContent);
  var t = new Date();
  calY = cur ? cur.y : t.getFullYear();
  calM = cur ? cur.m : t.getMonth();
  renderDateCal();
  openPick(cell);
}
function renderDateCal(){
  var pop = ensurePick();
  var sel = pickCell ? parseDate(pickCell.textContent) : null;
  var t = new Date();
  var first = new Date(calY, calM, 1);
  var startW = (first.getDay() + 6) % 7;
  var dim = new Date(calY, calM + 1, 0).getDate();
  var pdim = new Date(calY, calM, 0).getDate();
  var cells = [];
  for(var i = startW - 1; i >= 0; i--) cells.push({d: pdim - i, y: new Date(calY, calM, 0).getFullYear(), m: calM - 1, out: true});
  for(var d = 1; d <= dim; d++) cells.push({d: d, y: calY, m: calM, out: false});
  var rest = (7 - cells.length % 7) % 7;
  for(var j = 1; j <= rest; j++) cells.push({d: j, y: new Date(calY, calM + 1, 1).getFullYear(), m: calM + 1, out: true});

  var h = '<div class="pp-hd"><span>' + calY + ' 年 ' + (calM + 1) + ' 月</span>' +
          '<div class="nav"><button data-nav="-1">‹</button><button data-nav="1">›</button></div></div>' +
          '<div class="cal">' + WD.map(function(w){ return '<div class="wd">'+w+'</div>'; }).join('');
  cells.forEach(function(c){
    var mm = c.m, yy = c.y;
    while(mm < 0){ mm += 12; yy--; }
    while(mm > 11){ mm -= 12; yy++; }
    var cls = 'd' + (c.out ? ' out' : '');
    if(sel && !c.out && sel.y === yy && sel.m === mm && sel.d === c.d) cls += ' sel';
    if(!c.out && yy === t.getFullYear() && mm === t.getMonth() && c.d === t.getDate()) cls += ' today';
    h += '<button class="'+cls+'" data-day="'+c.d+'" data-y="'+yy+'" data-m="'+mm+'">'+c.d+'</button>';
  });
  h += '</div><div class="pp-ft">' +
       '<button class="btn" data-act="today">今天</button>' +
       '<button class="btn" data-act="clear">清除</button></div>';
  pop.innerHTML = h;
  placePop(pop, pickCell);
}
function showTimePick(cell){
  hideNamePop();
  pickCell = cell;
  var pop = ensurePick();
  var txt = cell.textContent.trim();
  var m = txt.match(/(\d{1,2}:\d{2})\s*[-~—－]\s*(\d{1,2}:\d{2})/);
  var sv = m ? m[1] : (/\d{1,2}:\d{2}/.test(txt) ? txt.match(/\d{1,2}:\d{2}/)[0] : '');
  var ev = m ? m[2] : '';

  // 最近用过的时间
  var recent = [];
  doc.rows.forEach(function(r){
    var v = norm(r.time);
    if(v && v !== '/' && recent.indexOf(v) < 0 && recent.length < 10) recent.push(v);
  });

  var h = '<div class="pp-hd"><span>选择时间</span><div class="nav"></div></div>' +
    '<div class="pp-lab">开始</div>' +
    '<div class="tm-row"><input class="tm-in" id="tS" inputmode="numeric" maxlength="5" placeholder="09:00" value="'+esc(sv)+'"></div>' +
    '<div class="pp-lab">结束</div>' +
    '<div class="tm-row"><input class="tm-in" id="tE" inputmode="numeric" maxlength="5" placeholder="10:00" value="'+esc(ev)+'"></div>';
  if(recent.length){
    h += '<div class="pp-lab" style="margin-top:10px">最近用过</div><div class="chips">' +
      recent.map(function(v){ return '<button class="chip2" data-tm="'+esc(v)+'">'+esc(v)+'</button>'; }).join('') + '</div>';
  }
  h += '<div class="pp-ft"><button class="btn pri" data-act="apply">确定</button>' +
       '<button class="btn" data-act="clear">清除</button></div>';
  pop.innerHTML = h;
  openPick(cell);

  // 输入 4 位数字自动补冒号
  ['#tS','#tE'].forEach(function(id){
    var el = pop.querySelector(id);
    if(!el) return;
    el.addEventListener('input', function(){
      var v = el.value.replace(/[^\d]/g, '').slice(0, 4);
      if(v.length >= 3) v = v.slice(0, 2) + ':' + v.slice(2);
      el.value = v;
    });
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); var b = pop.querySelector('[data-act="apply"]'); if(b) b.click(); }
    });
  });
  setTimeout(function(){ var f = pop.querySelector('#tS'); if(f){ f.focus(); f.select(); } }, 40);
}
function hidePick(){ if(pickPop) pickPop.classList.remove('open'); pickCell = null; }
function showPick(cell){
  var k = cell.dataset.k;
  if(k === 'date') return showDatePick(cell);
  if(k === 'time') return showTimePick(cell);
  hidePick();
}

/* ================= 导入导出 ================= */
function dl(name, text, type){
  var b = new Blob([text], {type:type});
  var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function tsName(ext){
  return (doc.title || '行程表').replace(/[\\/:*?"<>|]/g, '_').slice(0, 40) + '_' + new Date().toISOString().slice(0,10) + '.' + ext;
}
function exportCSV(){
  var q = function(v){ return '"' + String(v==null?'':v).replace(/"/g,'""').replace(/\r?\n/g,' ') + '"'; };
  var L = [];
  L.push(q(doc.title + (doc.sub ? ' - ' + doc.sub : '')));
  L.push(visibleCols(doc).map(function(c){ return q(hdrOf(doc, c.k)); }).join(','));
  var sp = buildSpans(doc), vcols = visibleCols(doc);
  doc.rows.forEach(function(r, i){
    var cells = [];
    vcols.forEach(function(c){
      cells.push(sp[c.k][i] ? q(c.k === 'seq' ? (r.g||1) : r[c.k]) : '');
    });

  });

  L.push(''); L.push(q('会务人员名单'));
